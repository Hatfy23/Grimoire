<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Dragonborn Library</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;1,400&family=UnifrakturMaguntia&family=Uncial+Antiqua&family=GFS+Didot&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0e0c09;--p1:#1a1610;--p2:#221e17;--p3:#2a261e;
  --b1:#3d3420;--b2:#5a4a28;
  --gold:#c8a050;--g2:#e8c878;--gdim:#7a5e28;
  --red2:#c04040;--red-bg:#1a0808;
  --text:#d4c8a8;--t2:#9a8a68;--t3:#5a5040;
  --green2:#5a8a40;--amber2:#c08030;
  --parch:#f5e6c8;--parch2:#ede0b4;--parch3:#e0cea0;
  --ink:#2a1a08;--ink2:#4a3018;
  --font:"Cinzel",serif;--body:"Crimson Text",serif;
  --medieval:"Uncial Antiqua",cursive;
  --book-body:"GFS Didot","Crimson Text",serif;
  --r:4px;
}
html,body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.6;min-height:100vh}

/* ── HEADER ── */
.hdr{background:var(--bg);border-bottom:2px solid var(--b2);position:sticky;top:0;z-index:200;padding-top:env(safe-area-inset-top,0px)}
.hdr-inner{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;gap:10px;max-width:1020px;margin:0 auto}
.brand{text-align:center;flex:1}
.brand-t{font-family:var(--font);font-size:clamp(13px,3vw,22px);color:var(--g2);letter-spacing:3px}
.brand-s{font-size:10px;color:var(--t2);letter-spacing:2px;font-family:var(--font)}
.hdr-dragon{opacity:.75;flex-shrink:0}
.hdr-side{text-align:right;flex-shrink:0;min-width:42px}
#sync-badge{font-size:9px;letter-spacing:.5px;font-family:var(--font);color:var(--t2);cursor:pointer;white-space:nowrap}
#sync-badge.ok{color:var(--green2)}
#sync-badge.err{color:var(--red2)}
#sync-badge.busy{color:var(--amber2)}

.wrap{max-width:1020px;margin:0 auto;padding:14px 13px 40px}
.rdiv{display:flex;align-items:center;gap:8px;margin:5px 0 9px}
.rdiv::before,.rdiv::after{content:"";flex:1;height:1px;background:var(--b2)}
.rdiv span{font-family:var(--font);font-size:9px;color:var(--t2);letter-spacing:2px;white-space:nowrap}

/* ── FORMS / BUTTONS ── */
.fgrp{display:flex;flex-direction:column;gap:3px}
.fgrp label{font-family:var(--font);font-size:9px;color:var(--t2);letter-spacing:1.5px;text-transform:uppercase}
.fgrp input,.fgrp select,.fgrp textarea{background:var(--bg);border:1px solid var(--b2);border-radius:2px;color:var(--text);padding:6px 8px;font-family:var(--body);font-size:14px;transition:border-color .15s;outline:none;width:100%}
.fgrp input:focus,.fgrp select:focus,.fgrp textarea:focus{border-color:var(--gdim)}
.fgrp select option{background:var(--p2)}
.btn-forge{background:var(--p2);color:var(--gold);border:1px solid var(--gdim);border-radius:2px;padding:6px 16px;font-family:var(--font);font-size:10px;letter-spacing:1px;cursor:pointer;transition:all .2s;text-transform:uppercase;white-space:nowrap}
.btn-forge:hover{background:var(--p3);border-color:var(--gold);color:var(--g2)}
.btn-forge:active{transform:scale(.98)}
.btn-danger{border-color:#601010;color:var(--red2)}
.btn-danger:hover{background:var(--red-bg);border-color:var(--red2);color:#e06060}
.btn-ghost{border-color:var(--b2);color:var(--t2)}

/* ── JUMP BAR ── */
.jumpbar{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;padding:4px 0 8px;margin-bottom:6px;scrollbar-width:none;position:sticky;top:calc(env(safe-area-inset-top,0px) + 73px);z-index:150;background:linear-gradient(var(--bg) 80%,transparent)}
.jumpbar::-webkit-scrollbar{display:none}
.tagchip{background:transparent;border:1px solid var(--b1);color:var(--t2);font-family:var(--font);font-size:9px;letter-spacing:1px;padding:4px 10px;border-radius:2px;cursor:pointer;text-transform:uppercase;transition:all .15s;white-space:nowrap;flex:0 0 auto}
.tagchip:hover{border-color:var(--gold);color:var(--g2);background:var(--p2)}

/* ── SECTIONS & SHELVES ── */
.section{margin-bottom:34px;scroll-margin-top:130px}
.sec-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;padding:0 2px}
.sec-plaque{font-family:var(--medieval);font-size:17px;color:#2a1a08;background:linear-gradient(180deg,#dcbc6c,#b8923f 60%,#9a7630);padding:3px 16px;border-radius:3px;border:1px solid #6b4f18;box-shadow:0 2px 4px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.35);letter-spacing:.5px}
.sec-count{font-family:var(--font);font-size:9px;color:var(--t3);letter-spacing:1px;text-transform:uppercase}
.sec-tools{margin-left:auto;display:flex;gap:4px}
.sec-tools button{background:transparent;border:1px solid var(--b1);color:var(--t2);width:26px;height:24px;border-radius:2px;cursor:pointer;font-size:11px;line-height:1}
.sec-tools button:hover:not(:disabled){border-color:var(--gdim);color:var(--gold)}
.sec-tools button:disabled{opacity:.25;cursor:default}
.shelf-wrap{position:relative;margin-bottom:14px;background:
  repeating-linear-gradient(90deg,rgba(255,255,255,.012) 0 2px,transparent 2px 7px),
  linear-gradient(180deg,#0f0b06,#1a130a 55%,#23190d);
  border:2px solid #3a2a12;border-bottom:none;border-radius:3px 3px 0 0;
  box-shadow:inset 0 12px 20px rgba(0,0,0,.75),inset 10px 0 16px rgba(0,0,0,.55),inset -10px 0 16px rgba(0,0,0,.55)}
.shelf-wrap::after{content:"";position:absolute;left:-8px;right:-8px;bottom:-14px;height:14px;pointer-events:none;
  background:repeating-linear-gradient(90deg,rgba(0,0,0,.1) 0 3px,transparent 3px 11px),linear-gradient(180deg,#8a6230,#6a4720 45%,#3d2810);
  border-radius:0 0 3px 3px;border-top:1px solid #a47a3c;box-shadow:0 7px 12px rgba(0,0,0,.65)}
.shelf-row{display:flex;align-items:flex-end;gap:2px;overflow-x:auto;overflow-y:hidden;padding:28px 46px 0;min-height:236px;scrollbar-width:thin;scrollbar-color:var(--b2) transparent}

/* a book: 3D box — spine faces you; on hover it turns to show the cover */
.bk{--d:108px;position:relative;width:var(--w);height:var(--h);flex:0 0 auto;perspective:900px;cursor:pointer;margin-right:1px;outline:none;-webkit-tap-highlight-color:transparent}
.bk3{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.22,.9,.28,1)}
.bk:focus-visible .bk3{outline:1px solid var(--gold)}
@media (hover:hover){
  .bk:hover{z-index:30}
  .bk:hover .bk3{transform:translateZ(80px) translateY(-6px) rotateY(-90deg)}
}
.bk.pulled{z-index:30}
.bk.pulled .bk3{transform:translateZ(80px) translateY(-6px) rotateY(-90deg)}
.face{position:absolute;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.f-spine{inset:0;transform:translateZ(calc(var(--d) / 2));border-radius:2px 1px 1px 2px;
  background:linear-gradient(90deg,rgba(0,0,0,.5),rgba(255,255,255,.1) 22%,rgba(0,0,0,.12) 60%,rgba(0,0,0,.55)),var(--c);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.45);display:flex;flex-direction:column;align-items:center;padding:20px 0 18px}
.f-spine::before,.f-spine::after{content:"";position:absolute;left:0;right:0;height:4px;background:linear-gradient(180deg,#e8c878,#9a7630);opacity:.85}
.f-spine::before{top:7px}.f-spine::after{bottom:7px}
.sp-icon{font-size:15px;line-height:1;margin-bottom:8px}
.sp-title{writing-mode:vertical-rl;font-family:var(--font);font-size:11px;letter-spacing:1px;color:#f0dca0;text-shadow:0 1px 2px rgba(0,0,0,.85);flex:1;min-height:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.f-cover{top:0;height:100%;width:var(--d);left:calc((var(--w) - var(--d)) / 2);transform:rotateY(90deg) translateZ(calc(var(--w) / 2));border-radius:1px 4px 4px 1px;padding:8px;display:flex;
  background:linear-gradient(135deg,rgba(255,255,255,.12),transparent 40%,rgba(0,0,0,.4)),var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.5)}
.cv-in{flex:1;min-width:0;border:1px solid rgba(232,200,120,.7);outline:1px solid rgba(232,200,120,.25);outline-offset:-5px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px 8px;gap:7px}
.cv-icon{font-size:30px;line-height:1}
.cv-title{font-family:var(--medieval);font-size:14px;line-height:1.25;color:#f4e2ae;text-shadow:0 1px 3px rgba(0,0,0,.85);word-break:break-word;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.cv-meta{font-family:var(--font);font-size:8px;letter-spacing:1px;color:rgba(244,226,174,.75);text-transform:uppercase}
.bk-new{flex:0 0 auto;align-self:flex-end;width:44px;height:150px;margin-left:12px;border:2px dashed var(--b2);border-radius:3px;display:flex;align-items:center;justify-content:center;color:var(--t2);font-size:24px;cursor:pointer;transition:all .2s}
.bk-new:hover{border-color:var(--gold);color:var(--g2);background:rgba(200,160,80,.06)}
.empty-s{color:var(--t3);font-size:13px;text-align:center;padding:20px;font-style:italic}

.archive{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:26px}

/* ── BOOK VIEWER ── */
.book-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:500;overflow-y:auto}
.book-overlay.show{display:block}
.book-container{max-width:820px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.book-toolbar{display:flex;align-items:center;gap:10px;padding:12px 20px;padding-top:calc(12px + env(safe-area-inset-top,0px));background:rgba(14,12,9,.95);border-bottom:1px solid var(--b2);position:sticky;top:0;z-index:10;flex-wrap:wrap}
.book-toolbar-title{font-family:var(--font);font-size:14px;color:var(--gold);flex:1;letter-spacing:1px;min-width:80px}
.book-pages{display:flex;flex:1;min-height:calc(100vh - 58px);min-height:calc(100dvh - 58px)}
.page-left,.page-right{flex:1;background:var(--parch);padding:28px 32px;position:relative;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.page-left{border-right:3px solid var(--ink2);box-shadow:inset -8px 0 16px rgba(0,0,0,.15)}
.page-right{box-shadow:inset 8px 0 16px rgba(0,0,0,.08)}
.book-spine-center{width:6px;background:linear-gradient(180deg,var(--ink2),#8a6030,var(--ink2));flex-shrink:0}
.page-body{flex:1;overflow-y:auto;position:relative;scrollbar-width:thin;scrollbar-color:var(--parch3) transparent}
.page-turn-bar{display:flex;align-items:center;justify-content:space-between;padding-top:10px;border-top:1px solid var(--parch3);flex-shrink:0;min-height:32px}
.page-num{font-family:var(--font);font-size:9px;color:var(--ink2);letter-spacing:1px}
.turn-btn{background:transparent;border:1px solid var(--parch3);color:var(--ink2);cursor:pointer;font-family:var(--font);font-size:10px;padding:3px 10px;border-radius:2px;transition:all .15s}
.turn-btn:hover{border-color:var(--ink2);color:var(--ink)}
.turn-btn:disabled{opacity:.3;cursor:not-allowed}
.page-content{color:var(--ink);font-family:var(--book-body);font-size:15px;line-height:1.85;min-height:100%;word-break:break-word}
.page-heading{font-family:var(--medieval);font-size:22px;color:var(--ink);margin-bottom:16px;text-align:center}
.page-textarea{width:100%;height:100%;min-height:300px;background:transparent;border:none;outline:none;font-family:var(--book-body);font-size:15px;line-height:1.85;color:var(--ink);resize:none;overflow-y:auto}
.m-head{display:none}
.mprev{display:none}
.chapter-item{padding:10px 0;border-bottom:1px solid var(--parch3);cursor:pointer;transition:color .15s}
.chapter-item:hover{color:var(--ink)}
.chapter-item:last-child{border-bottom:none}
.chapter-num{font-family:var(--font);font-size:9px;color:var(--ink2);letter-spacing:1px;margin-bottom:2px}
.chapter-title{font-family:var(--medieval);font-size:15px;color:var(--ink)}
.chapter-preview{font-size:11px;color:var(--ink2);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Diary groups */
.diary-year-group{margin-bottom:20px}
.diary-year-title{font-family:var(--medieval);font-size:26px;color:var(--ink);margin-bottom:4px}
.diary-month-group{margin-bottom:14px;margin-left:12px}
.diary-month-title{font-family:var(--font);font-size:11px;color:var(--ink2);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid var(--parch3)}
.diary-entry-item{padding:6px 0;cursor:pointer;border-bottom:1px solid var(--parch3)}
.diary-entry-item:hover .diary-entry-title{text-decoration:underline}
.diary-entry-date{font-family:var(--font);font-size:9px;color:var(--ink2);letter-spacing:1px}
.diary-entry-title{font-family:var(--medieval);font-size:14px;color:var(--ink)}
.diary-entry-preview{font-size:11px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ── MODALS ── */
.modal-back{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);align-items:center;justify-content:center;z-index:600;padding:20px}
.modal-back.show{display:flex}
.modal-box{background:var(--p1);border:1px solid var(--b2);border-radius:var(--r);padding:24px 20px;max-width:320px;width:100%;text-align:center;position:relative}
.modal-box::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.modal-title{font-family:var(--font);font-size:14px;color:var(--gold);margin-bottom:12px;letter-spacing:1px}
.modal-btns{display:flex;gap:8px;justify-content:center}

/* ── TOAST ── */
.toast{position:fixed;bottom:12px;left:50%;transform:translateX(-50%) translateY(8px);min-width:160px;max-width:300px;background:var(--p2);color:var(--gold);border:1px solid var(--gdim);border-radius:var(--r);padding:7px 13px;font-family:var(--font);font-size:10px;letter-spacing:.5px;z-index:9999;opacity:0;transition:all .25s;pointer-events:none;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── MOBILE ── */
@media(max-width:600px){
  .hdr-dragon{display:none}
  .page-left{display:none}
  .book-pages{flex-direction:column}
  .book-spine-center{display:none}
  .page-right{border-radius:0;padding:20px 18px}
  .shelf-row{padding:26px 40px 0;min-height:226px}
  .sec-plaque{font-size:15px;padding:3px 12px}
  .book-toolbar{padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
  .mprev{display:inline-block}
  .m-head{display:block;text-align:center;margin-bottom:14px}
  .m-head .page-heading{font-size:18px;margin-bottom:4px}
  .m-head .m-sub{font-size:10px;letter-spacing:1.5px;color:var(--ink2);text-transform:uppercase;font-family:var(--font)}
}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-inner">
    <svg class="hdr-dragon" width="42" height="34" viewBox="0 0 60 50" fill="none"><g opacity=".7"><path d="M10 40 Q5 30 8 20 Q12 10 20 8 Q15 18 18 28 Q12 32 10 40Z" fill="#5a4010"/><path d="M20 8 Q30 4 38 10 Q32 8 28 14 Q24 20 22 28 Q18 22 20 8Z" fill="#7a5820"/><path d="M8 20 Q2 15 0 8 Q4 12 10 14 Q8 17 8 20Z" fill="#4a3010"/><path d="M38 10 Q46 6 52 12 Q48 10 44 16 Q40 14 38 10Z" fill="#4a3010"/><path d="M18 28 Q22 36 18 44 Q14 36 10 40 Q12 32 18 28Z" fill="#3a2808"/><circle cx="24" cy="14" r="2" fill="#c8a050" opacity=".8"/></g></svg>
    <div class="brand"><div class="brand-t">Dragonborn Library</div><div class="brand-s">Tomes &amp; Chronicles</div></div>
    <div class="hdr-side"><div id="sync-badge" onclick="manualSync()" title="Tap to sync now">☁ …</div></div>
  </div>
</div>

<div class="wrap">
  <div class="rdiv"><span>your library</span></div>
  <div class="jumpbar" id="jumpbar"></div>
  <div id="books-shelf"></div>
  <div class="archive">
    <button class="btn-forge" onclick="openSecModal('create')">+ New Section</button>
    <button class="btn-forge btn-ghost" onclick="exportBooks()">⤓ Export backup</button>
    <button class="btn-forge btn-ghost" onclick="document.getElementById('import-file').click()">⤒ Import JSON</button>
    <input type="file" id="import-file" accept=".json,application/json" style="display:none" onchange="importBooks(this)">
  </div>
</div>

<!-- BOOK OVERLAY -->
<div class="book-overlay" id="book-overlay">
  <div class="book-container">
    <div class="book-toolbar">
      <button class="btn-forge" onclick="closeBook()">← Back</button>
      <span class="book-toolbar-title" id="book-toolbar-title">Book</span>
      <div id="book-toolbar-actions" style="display:flex;gap:6px;flex-wrap:wrap"></div>
    </div>
    <div class="book-pages" id="book-pages-wrap">
      <div class="page-left" id="book-page-left">
        <div class="page-body" id="book-left-body"></div>
        <div class="page-turn-bar">
          <button class="turn-btn" id="turn-prev" onclick="turnPage(-1)">◀ Prev</button>
          <span class="page-num" id="page-num-left"></span>
          <span></span>
        </div>
      </div>
      <div class="book-spine-center"></div>
      <div class="page-right" id="book-page-right">
        <div class="page-body" id="book-right-body"></div>
        <div class="page-turn-bar">
          <button class="turn-btn mprev" id="turn-prev-m" onclick="turnPage(-1)">◀ Prev</button>
          <span class="page-num" id="page-num-right"></span>
          <button class="turn-btn" id="turn-next" onclick="turnPage(1)">Next ▶</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- NEW BOOK MODAL -->
<div class="modal-back" id="book-modal">
  <div class="modal-box">
    <div class="modal-title" id="book-modal-title">New Book</div>
    <div class="fgrp" style="margin-bottom:8px;text-align:left"><label>Title</label><input id="bm-title" placeholder="e.g. My Novel, Recipes..."></div>
    <div class="fgrp" style="margin-bottom:8px;text-align:left"><label>Emoji / Icon</label><input id="bm-icon" maxlength="4" placeholder="📖"></div>
    <div class="fgrp" style="margin-bottom:8px;text-align:left"><label>Section (shelf)</label><select id="bm-section"></select></div>
    <div class="fgrp" style="margin-bottom:8px;text-align:left"><label>Cover color</label><input id="bm-color" type="color" value="#8b2020" style="height:34px;padding:2px 4px"></div>
    <div class="fgrp" style="margin-bottom:13px;text-align:left">
      <label>Type</label>
      <select id="bm-type"><option value="book">Custom Book (chapters)</option><option value="diary">Diary / Journal</option></select>
    </div>
    <div class="modal-btns">
      <button class="btn-forge" id="bm-save" onclick="saveBook()">Create</button>
      <button class="btn-forge btn-danger" onclick="closeBookModal()">Cancel</button>
    </div>
  </div>
</div>

<!-- SECTION MODAL -->
<div class="modal-back" id="sec-modal">
  <div class="modal-box">
    <div class="modal-title" id="sec-modal-title">New Section</div>
    <div class="fgrp" style="margin-bottom:13px;text-align:left"><label>Section name</label><input id="sm-name" maxlength="30" placeholder="e.g. Games, Work, Journals..."></div>
    <div class="modal-btns">
      <button class="btn-forge" onclick="saveSection()">Save</button>
      <button class="btn-forge btn-danger" onclick="closeSecModal()">Cancel</button>
    </div>
  </div>
</div>

<!-- NEW CHAPTER MODAL -->
<div class="modal-back" id="chap-modal">
  <div class="modal-box">
    <div class="modal-title">New Chapter</div>
    <div class="fgrp" style="margin-bottom:13px;text-align:left"><label>Chapter title</label><input id="chap-title-input" placeholder="e.g. Chapter 1: The Beginning..."></div>
    <div class="modal-btns">
      <button class="btn-forge" onclick="saveChapter()">Create</button>
      <button class="btn-forge btn-danger" onclick="closeChapModal()">Cancel</button>
    </div>
  </div>
</div>

<!-- NEW DIARY ENTRY MODAL -->
<div class="modal-back" id="diary-modal">
  <div class="modal-box">
    <div class="modal-title">New Diary Entry</div>
    <div class="fgrp" style="margin-bottom:8px;text-align:left"><label>Title (optional)</label><input id="diary-title-input" placeholder="e.g. A good day..."></div>
    <div class="fgrp" style="margin-bottom:13px;text-align:left"><label>Date</label><input id="diary-date-input" type="date"></div>
    <div class="modal-btns">
      <button class="btn-forge" onclick="saveDiaryEntry()">Begin Writing</button>
      <button class="btn-forge btn-danger" onclick="closeDiaryModal()">Cancel</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ═══════════════════════════════════════════
//  CONFIG — Supabase

//  SUPABASE (REST, no library needed)
// ═══════════════════════════════════════════
async function sb(path,opts={}){
  const res=await fetch(SB_URL+"/rest/v1/"+path,{
    ...opts,
    headers:{apikey:SB_KEY,Authorization:"Bearer "+SB_KEY,"Content-Type":"application/json",...(opts.headers||{})}
  });
  if(!res.ok){const t=await res.text().catch(()=>"");throw new Error(res.status+" "+t.slice(0,200));}
  const txt=await res.text();
  return txt?JSON.parse(txt):null;
}

function cacheLocal(){
  try{
    localStorage.setItem(LS_CACHE,JSON.stringify(books));
    localStorage.setItem(LS_PENDING,JSON.stringify({dirty:[...dirty],removed:[...removed]}));
    localStorage.setItem(LS_META,JSON.stringify(meta));
  }catch(e){}
}
function loadLocal(){
  try{
    const b=JSON.parse(localStorage.getItem(LS_CACHE)||"null");if(Array.isArray(b))books=b;
    const m=JSON.parse(localStorage.getItem(LS_META)||"null");if(m&&Array.isArray(m.sections))meta=m;
    const p=JSON.parse(localStorage.getItem(LS_PENDING)||"null");
    if(p){(p.dirty||[]).forEach(i=>dirty.add(i));(p.removed||[]).forEach(i=>removed.add(i));}
  }catch(e){}
}

async function loadRemote(){
  badge("☁ syncing…","busy");
  try{
    const rows=await sb(TABLE+"?select=id,position,data&order=position.asc");
    const metaRow=rows.find(r=>r.id==="_meta");
    if(metaRow&&!dirty.has("_meta"))meta={sections:[],...metaRow.data};
    const remote=rows.filter(r=>r.id!=="_meta").map(r=>({...r.data,id:r.id}));
    // keep local versions of anything not pushed yet
    const localDirty=new Map(books.filter(b=>dirty.has(b.id)).map(b=>[b.id,b]));
    const merged=remote.filter(b=>!removed.has(b.id)).map(b=>localDirty.get(b.id)||b);
    for(const [id,b] of localDirty) if(!merged.find(x=>x.id===id)) merged.push(b);
    books=merged;
    cacheLocal();
    badge("☁ synced","ok");
    if(dirty.size||removed.size)scheduleFlush(300);
    renderShelf();
    if(bookState.bookId&&document.getElementById("book-overlay").classList.contains("show")&&!bookState.editMode){
      if(!books.find(b=>b.id===bookState.bookId))closeBook();else renderBookView();
    }
  }catch(e){
    console.error(e);
    badge("☁ offline","err");
    if(/relation|does not exist|42P01|PGRST205/.test(e.message))toast("Table not found — run the SQL setup first.");
  }
}

function markDirty(id){dirty.add(id);cacheLocal();scheduleFlush(700);badge("☁ …","busy");}
function scheduleFlush(ms){clearTimeout(flushTimer);flushTimer=setTimeout(flush,ms);}
async function flush(){
  if(flushing)return;
  if(!dirty.size&&!removed.size)return;
  flushing=true;
  const ids=[...dirty],gone=[...removed];
  try{
    if(ids.length){
      const rows=ids.map(id=>{
        if(id==="_meta")return {id,position:-1,data:meta,updated_at:new Date().toISOString()};
        const i=books.findIndex(b=>b.id===id);
        if(i<0)return null;
        return {id,position:i,data:books[i],updated_at:new Date().toISOString()};
      }).filter(Boolean);
      if(rows.length)await sb(TABLE+"?on_conflict=id",{method:"POST",headers:{Prefer:"resolution=merge-duplicates,return=minimal"},body:JSON.stringify(rows)});
    }
    for(const id of gone)await sb(TABLE+"?id=eq."+encodeURIComponent(id),{method:"DELETE",headers:{Prefer:"return=minimal"}});
    ids.forEach(i=>dirty.delete(i));gone.forEach(i=>removed.delete(i));
    cacheLocal();
    badge("☁ synced","ok");
  }catch(e){
    console.error(e);
    badge("☁ retrying…","err");
    scheduleFlush(10000);
  }
  flushing=false;
  if((dirty.size||removed.size)&&!flushTimer)scheduleFlush(1500);
}
function manualSync(){flush().then(loadRemote);}

function counts(b){const d=b.type==="diary",n=(d?b.entries:b.chapters||[]);const k=(n||[]).length;return k+" "+(d?(k===1?"entry":"entries"):(k===1?"chapter":"chapters"));}
const hashStr=s=>{s=String(s);let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h);};
function spineDims(b){
  const h=hashStr(b.id);
  const size=b.type==="diary"?(b.entries||[]).length:(b.chapters||[]).length;
  return {w:34+Math.min(6,size)*3+(h%3)*3, h:156+(Math.floor(h/7)%5)*9};   // thicker book = more content
}
function getSections(){
  const out=[];
  for(const s of (meta.sections||[]))if(s&&!out.includes(s))out.push(s);
  for(const b of books)if(b.tag&&!out.includes(b.tag))out.push(b.tag);
  return out;
}
let curBlocks=[];
function bookHtml(b){
  const {w,h}=spineDims(b);const id=esc(b.id);
  return `<div class="bk" style="--w:${w}px;--h:${h}px;--c:${esc(b.color||"#5a4010")}" title="${esc(b.title)}" tabindex="0" role="button" onclick="bookClick(event,'${id}')" onkeydown="if(event.key==='Enter')openBook('${id}')">
    <div class="bk3">
      <div class="face f-spine"><span class="sp-icon">${esc(b.icon||"📖")}</span><span class="sp-title">${esc(b.title)}</span></div>
      <div class="face f-cover"><div class="cv-in"><div class="cv-icon">${esc(b.icon||"📖")}</div><div class="cv-title">${esc(b.title)}</div><div class="cv-meta">${b.type==="diary"?"Diary":"Book"} · ${counts(b)}</div></div></div>
    </div></div>`;
}
function renderShelf(){
  const root=document.getElementById("books-shelf");
  const secs=getSections();
  curBlocks=secs.map(s=>({name:s,list:books.filter(b=>b.tag===s),real:true}));
  const loose=books.filter(b=>!b.tag);
  if(loose.length||!curBlocks.length)curBlocks.push({name:"Unsorted",list:loose,real:false});
  document.getElementById("jumpbar").innerHTML=curBlocks.length>1?curBlocks.map((s,i)=>`<button class="tagchip" onclick="jumpTo(${i})">${esc(s.name)}</button>`).join(""):"";
  root.innerHTML=curBlocks.map((s,i)=>{
    const tools=s.real?`<div class="sec-tools">
      <button title="Move up" onclick="secMove(${i},-1)" ${i===0?"disabled":""}>▲</button>
      <button title="Move down" onclick="secMove(${i},1)" ${i===secs.length-1?"disabled":""}>▼</button>
      <button title="Rename" onclick="openSecModal('rename',${i})">✎</button>
      <button title="Delete section" onclick="secDelete(${i})">✕</button></div>`:"";
    const n=s.list.length;
    return `<section class="section" id="sec-${i}">
      <div class="sec-head"><span class="sec-plaque">${esc(s.name)}</span><span class="sec-count">${n} ${n===1?"tome":"tomes"}</span>${tools}</div>
      <div class="shelf-wrap"><div class="shelf-row">${s.list.map(bookHtml).join("")}<div class="bk-new" title="New book here" onclick="openBookModal(${i})">+</div></div></div>
    </section>`;
  }).join("");
}
function jumpTo(i){const el=document.getElementById("sec-"+i);if(el)el.scrollIntoView({behavior:"smooth",block:"start"});}

// touch devices have no hover: 1st tap pulls the book out, 2nd tap opens it
function bookClick(ev,id){
  const el=ev.currentTarget;
  if(window.matchMedia("(hover:none)").matches&&!el.classList.contains("pulled")){
    document.querySelectorAll(".bk.pulled").forEach(x=>x.classList.remove("pulled"));
    el.classList.add("pulled");return;

}

// ── section management ──
let secModalMode="create",secModalIdx=null;
function openSecModal(mode,idx){
  secModalMode=mode;secModalIdx=idx;
  document.getElementById("sec-modal-title").textContent=mode==="rename"?"Rename Section":"New Section";
  document.getElementById("sm-name").value=mode==="rename"?curBlocks[idx].name:"";
  document.getElementById("sec-modal").classList.add("show");
  setTimeout(()=>document.getElementById("sm-name").focus(),80);
}
function closeSecModal(){document.getElementById("sec-modal").classList.remove("show");}
function saveSection(){
  const name=document.getElementById("sm-name").value.trim();
  if(!name){toast("Enter a name.");return;}
  const all=getSections();
  if(secModalMode==="rename"){
    const old=curBlocks[secModalIdx].name;
    if(name!==old&&(all.includes(name)||name.toLowerCase()==="unsorted")){toast("That section already exists.");return;}
    if(name!==old){
      books.forEach(b=>{if(b.tag===old){b.tag=name;markDirty(b.id);}});
      meta.sections=all.map(s=>s===old?name:s);markDirty("_meta");
    }
    toast("Section renamed.");
  }else{
    if(all.includes(name)||name.toLowerCase()==="unsorted"){toast("That section already exists.");return;}
    meta.sections=[...all,name];markDirty("_meta");
    toast("Section created!");
  }
  closeSecModal();renderShelf();
  if(secModalMode==="create")setTimeout(()=>jumpTo(curBlocks.findIndex(b=>b.name===name)),50);
}
function secMove(i,dir){
  const all=getSections(),j=i+dir;
  if(j<0||j>=all.length)return;
  [all[i],all[j]]=[all[j],all[i]];
  meta.sections=all;markDirty("_meta");renderShelf();
}
function secDelete(i){
  const s=curBlocks[i];if(!s||!s.real)return;
  const n=s.list.length;
  if(!confirm(n?`Delete section "${s.name}"? Its ${n} book(s) move to Unsorted (nothing is deleted).`:`Delete section "${s.name}"?`))return;
  books.forEach(b=>{if(b.tag===s.name){delete b.tag;markDirty(b.id);}});
  meta.sections=getSections().filter(x=>x!==s.name);markDirty("_meta");
  renderShelf();toast("Section removed.");
}

function saveBook(){
  const title=document.getElementById("bm-title").value.trim();
  if(!title){toast("Enter a title.");return;}
  const icon=document.getElementById("bm-icon").value||"📖";
  const tag=document.getElementById("bm-section").value;
  const color=document.getElementById("bm-color").value;
  if(editingBookId){
    const b=books.find(x=>x.id===editingBookId);if(!b)return;
    b.title=title;b.icon=icon;b.color=color;
    if(tag)b.tag=tag;else delete b.tag;
    markDirty(b.id);closeBookModal();editingBookId=null;
    renderShelf();renderBookView();toast("Book updated!");

  }
  const type=document.getElementById("bm-type").value;
  const book={id:"b"+Date.now(),title,icon,type,color,chapters:[],entries:[]};
  if(tag)book.tag=tag;
  books.push(book);markDirty(book.id);closeBookModal();renderShelf();toast("Book created!");
  openBook(book.id);
}

function openBook(bookId){

  bookState={bookId,view:"toc",chapterId:null,entryId:null,editMode:false,page:0};
  document.getElementById("book-overlay").classList.add("show");

}
function closeBook(){
  if(bookState.editMode)saveCurrentText(true);
  document.getElementById("book-overlay").classList.remove("show");
  document.body.style.overflow="";
  bookState.bookId=null;
  renderShelf();
}
function paginate(items,perPage){const pages=[];for(let i=0;i<items.length;i+=perPage)pages.push(items.slice(i,i+perPage));return pages.length?pages:[[]];}
function paginateText(text,cpp){
  if(!text)return [""];
  const pages=[];let start=0;
  while(start<text.length){let end=start+cpp;if(end<text.length){let nl=text.lastIndexOf("\n",end);if(nl>start+cpp*0.5)end=nl+1;}pages.push(text.slice(start,end));start=end;}
  return pages;
}
const cpp=()=>window.innerWidth<=600?650:900;
const ITEMS_PER_TOC_PAGE=6;

function turnPage(dir){
  if(bookState.editMode)return;
  bookState.page=Math.max(0,(bookState.page||0)+dir);
  renderBookView();
  document.getElementById("book-overlay").scrollTop=0;
  document.getElementById("book-right-body").scrollTop=0;
}

    if(bookState.editMode){
      rightBody.innerHTML=mh+`<textarea class="page-textarea" id="chapter-textarea" placeholder="Write your story here..." oninput="queueTextSave()">${esc(chapter.content||"")}</textarea>`;
      prevBtn.disabled=true;nextBtn.disabled=true;
      numLeft.textContent="";numRight.textContent="editing...";
      actEl.innerHTML=`<button class="btn-forge" onclick="saveCurrentText();bookState.editMode=false;bookState.page=0;renderBookView()">Save</button><button class="btn-forge btn-danger" onclick="deleteChapter('${esc(chapter.id)}')">Delete</button>${backBtn("ToC")}`;

      numLeft.textContent=`Chapter ${idx+1}`;numRight.textContent=pages.length>1?`Page ${curPg+1} of ${pages.length}`:"";
      actEl.innerHTML=`<button class="btn-forge" onclick="bookState.editMode=true;renderBookView()">✎ Edit</button><button class="btn-forge btn-danger" onclick="deleteChapter('${esc(chapter.id)}')">Delete</button>${backBtn("ToC")}`;
    }
  }

  else if(bookState.view==="diary-entry"){
    const entry=(book.entries||[]).find(e=>e.id===bookState.entryId);if(!entry)return;
    const d=new Date(entry.date+"T00:00:00").toLocaleDateString("en",{weekday:"long",year:"numeric",month:"long",day:"numeric"});
    leftBody.innerHTML=`<div class="page-content" style="text-align:center;padding-top:60px">
      <div class="page-heading">${esc(book.title)}</div>
      <div style="margin-top:24px;font-size:11px;color:var(--ink2);letter-spacing:1.5px;text-transform:uppercase">${d}</div>
      <div style="font-family:'Uncial Antiqua',cursive;font-size:20px;color:var(--ink);margin-top:8px">${esc(entry.title||"Untitled")}</div>
    </div>`;
    const mh=`<div class="m-head"><div class="m-sub">${d}</div><div class="page-heading">${esc(entry.title||"Untitled")}</div></div>`;
    if(bookState.editMode){
      rightBody.innerHTML=mh+`<textarea class="page-textarea" id="diary-textarea" placeholder="Write your thoughts..." oninput="queueTextSave()">${esc(entry.content||"")}</textarea>`;
      prevBtn.disabled=true;nextBtn.disabled=true;
      numLeft.textContent="";numRight.textContent="editing...";
      actEl.innerHTML=`<button class="btn-forge" onclick="saveCurrentText();bookState.editMode=false;bookState.page=0;renderBookView()">Save</button><button class="btn-forge btn-danger" onclick="deleteDiaryEntry('${esc(entry.id)}')">Delete</button>${backBtn("Diary")}`;
    }else{
      const text=entry.content||"";
      const pages=paginateText(text,cpp());
      const curPg=Math.max(0,Math.min(pg,pages.length-1));
      bookState.page=curPg;
      rightBody.innerHTML=mh+`<div class="page-content" style="white-space:pre-wrap">${pages[curPg]?esc(pages[curPg]):'<span style="color:var(--ink2);font-style:italic">Nothing written yet.</span>'}</div>`;
      prevBtn.disabled=curPg<=0;nextBtn.disabled=curPg>=pages.length-1;
      numLeft.textContent=d.split(",")[0];numRight.textContent=pages.length>1?`Page ${curPg+1} of ${pages.length}`:"";
      actEl.innerHTML=`<button class="btn-forge" onclick="bookState.editMode=true;renderBookView()">✎ Write</button><button class="btn-forge btn-danger" onclick="deleteDiaryEntry('${esc(entry.id)}')">Delete</button>${backBtn("Diary")}`;
    }
  }
  document.getElementById("turn-prev-m").disabled=prevBtn.disabled;
}

// ── text saving ──
function queueTextSave(){clearTimeout(textTimer);textTimer=setTimeout(()=>saveCurrentText(true),1500);}
function saveCurrentText(silent){
  clearTimeout(textTimer);
  const book=books.find(b=>b.id===bookState.bookId);if(!book)return;
  if(bookState.view==="chapter"){
    const ta=document.getElementById("chapter-textarea");
    const ch=(book.chapters||[]).find(c=>c.id===bookState.chapterId);
    if(ch&&ta)ch.content=ta.value;
  }else if(bookState.view==="diary-entry"){
    const ta=document.getElementById("diary-textarea");
    const en=(book.entries||[]).find(e=>e.id===bookState.entryId);
    if(en&&ta)en.content=ta.value;
  }else return;
  markDirty(book.id);
  if(!silent)toast("Saved!");
}

// ── chapters ──
function openChapModal(){document.getElementById("chap-title-input").value="";document.getElementById("chap-modal").classList.add("show");setTimeout(()=>document.getElementById("chap-title-input").focus(),80);}
function closeChapModal(){document.getElementById("chap-modal").classList.remove("show");}
function saveChapter(){
  const title=document.getElementById("chap-title-input").value.trim();if(!title){toast("Enter a title.");return;}
  const book=books.find(b=>b.id===bookState.bookId);if(!book)return;
  if(!book.chapters)book.chapters=[];
  const ch={id:"c"+Date.now(),title,content:""};
  book.chapters.push(ch);markDirty(book.id);closeChapModal();
  bookState.view="chapter";bookState.chapterId=ch.id;bookState.editMode=true;bookState.page=0;
  renderBookView();toast("Chapter created!");
}
function deleteChapter(cid){
  if(!confirm("Delete this chapter?"))return;
  const book=books.find(b=>b.id===bookState.bookId);if(!book)return;
  clearTimeout(textTimer);
  book.chapters=book.chapters.filter(c=>c.id!==cid);markDirty(book.id);
  bookState.view="toc";bookState.chapterId=null;bookState.editMode=false;bookState.page=0;renderBookView();toast("Deleted.");
}
function openChapter(cid){bookState.view="chapter";bookState.chapterId=cid;bookState.editMode=false;bookState.page=0;renderBookView();document.getElementById("book-overlay").scrollTop=0;}

// ── diary entries ──
function openDiaryModal(){
  document.getElementById("diary-title-input").value="";
  document.getElementById("diary-date-input").value=new Date().toISOString().split("T")[0];
  document.getElementById("diary-modal").classList.add("show");
}
function closeDiaryModal(){document.getElementById("diary-modal").classList.remove("show");}
function saveDiaryEntry(){
  const title=document.getElementById("diary-title-input").value.trim();
  const date=document.getElementById("diary-date-input").value||new Date().toISOString().split("T")[0];
  const book=books.find(b=>b.id===bookState.bookId);if(!book)return;
  if(!book.entries)book.entries=[];
  const en={id:"e"+Date.now(),date,title,content:""};
  book.entries.push(en);markDirty(book.id);closeDiaryModal();
  bookState.view="diary-entry";bookState.entryId=en.id;bookState.editMode=true;bookState.page=0;
  renderBookView();toast("Entry created!");
}
function openDiaryEntry(eid){bookState.view="diary-entry";bookState.entryId=eid;bookState.editMode=false;bookState.page=0;renderBookView();document.getElementById("book-overlay").scrollTop=0;}
function deleteDiaryEntry(eid){
  if(!confirm("Delete this entry?"))return;
  const book=books.find(b=>b.id===bookState.bookId);if(!book)return;
  clearTimeout(textTimer);
  book.entries=(book.entries||[]).filter(e=>e.id!==eid);markDirty(book.id);
  bookState.view="toc";bookState.entryId=null;bookState.editMode=false;bookState.page=0;renderBookView();toast("Deleted.");
}
function deleteBook(bid){
  if(!confirm("Delete this entire book?"))return;
  clearTimeout(textTimer);
  bookState.editMode=false;
  books=books.filter(b=>b.id!==bid);
  dirty.delete(bid);removed.add(bid);cacheLocal();scheduleFlush(300);
  closeBook();toast("Book deleted.");
}

// ═══════════════════════════════════════════
//  BACKUP — export / import JSON
// ═══════════════════════════════════════════
function exportBooks(){
  const blob=new Blob([JSON.stringify({books,sections:getSections(),_exportedAt:Date.now()},null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="dragonborn_library_"+new Date().toISOString().slice(0,10)+".json";
  a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function importBooks(input){
  const f=input.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      const arr=Array.isArray(d)?d:(d.books||[]);
      if(!arr.length){toast("No books found in file.");return;}
      let added=0;
      for(const b of arr){
        if(!b||!b.id||!b.title)continue;
        if(books.find(x=>x.id===b.id))continue;   // never overwrite existing books
        books.push(b);markDirty(b.id);added++;
      }
      renderShelf();
      toast(added?`${added} book(s) imported.`:"Nothing new to import.");
    }catch(e){toast("Invalid JSON file.");}
    input.value="";
  };
  r.readAsText(f);
}

// ═══════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){
    ["book-modal","chap-modal","diary-modal","sec-modal"].forEach(id=>document.getElementById(id).classList.remove("show"));
  }
});
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="visible"&&!bookState.editMode&&!dirty.size&&!removed.size)loadRemote();
  if(document.visibilityState==="hidden"){if(bookState.editMode)saveCurrentText(true);flush();}
});
window.addEventListener("beforeunload",()=>{if(bookState.editMode)saveCurrentText(true);});
window.addEventListener("resize",()=>{if(document.getElementById("book-overlay").classList.contains("show")&&!bookState.editMode)renderBookView();});

loadLocal();
renderShelf();
loadRemote();
</script>
