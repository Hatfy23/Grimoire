<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0e0c09;--p1:#1a1610;--p2:#221e17;--p3:#2a261e;
  --b1:#3d3420;--b2:#5a4a28;
  --gold:#c8a050;--g2:#e8c878;--gdim:#7a5e28;
  --red2:#c04040;--red-bg:#1a0808;
  --text:#d4c8a8;--t2:#9a8a68;--t3:#5a5040;
  --green2:#5a8a40;--amber2:#c08030;
  --parch:#f5e6c8;--parch2:#ede0b4;--parch3:#e0cea0;
  --ink:#2a1a08;--ink2:#4a3018;
  --font:"Cinzel",serif;--body:"Crimson Text",serif;
  --medieval:"Uncial Antiqua",cursive;
  --book-body:"GFS Didot","Crimson Text",serif;
  --r:4px;
}
html,body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.6;min-height:100vh}

/* ── HEADER ── */
.hdr{background:var(--bg);border-bottom:2px solid var(--b2);position:sticky;top:0;z-index:200;padding-top:env(safe-area-inset-top,0px)}
.hdr-inner{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;gap:10px;max-width:1020px;margin:0 auto}
.brand{text-align:center;flex:1}
.brand-t{font-family:var(--font);font-size:clamp(13px,3vw,22px);color:var(--g2);letter-spacing:3px}
.brand-s{font-size:10px;color:var(--t2);letter-spacing:2px;font-family:var(--font)}
.hdr-dragon{opacity:.75;flex-shrink:0}
.hdr-side{text-align:right;flex-shrink:0;min-width:42px}
#sync-badge{font-size:9px;letter-spacing:.5px;font-family:var(--font);color:var(--t2);cursor:pointer;white-space:nowrap}
#sync-badge.ok{color:var(--green2)}
#sync-badge.err{color:var(--red2)}
#sync-badge.busy{color:var(--amber2)}

.wrap{max-width:1020px;margin:0 auto;padding:14px 13px 40px}
.rdiv{display:flex;align-items:center;gap:8px;margin:5px 0 9px}
.rdiv::before,.rdiv::after{content:"";flex:1;height:1px;background:var(--b2)}
.rdiv span{font-family:var(--font);font-size:9px;color:var(--t2);letter-spacing:2px;white-space:nowrap}

/* ── FORMS / BUTTONS ── */
.fgrp{display:flex;flex-direction:column;gap:3px}
.fgrp label{font-family:var(--font);font-size:9px;color:var(--t2);letter-spacing:1.5px;text-transform:uppercase}
.fgrp input,.fgrp select,.fgrp textarea{background:var(--bg);border:1px solid var(--b2);border-radius:2px;color:var(--text);padding:6px 8px;font-family:var(--body);font-size:14px;transition:border-color .15s;outline:none;width:100%}
.fgrp input:focus,.fgrp select:focus,.fgrp textarea:focus{border-color:var(--gdim)}
.fgrp select option{background:var(--p2)}
.btn-forge{background:var(--p2);color:var(--gold);border:1px solid var(--gdim);border-radius:2px;padding:6px 16px;font-family:var(--font);font-size:10px;letter-spacing:1px;cursor:pointer;transition:all .2s;text-transform:uppercase;white-space:nowrap}
.btn-forge:hover{background:var(--p3);border-color:var(--gold);color:var(--g2)}
.btn-forge:active{transform:scale(.98)}
.btn-danger{border-color:#601010;color:var(--red2)}
.btn-danger:hover{background:var(--red-bg);border-color:var(--red2);color:#e06060}
.btn-ghost{border-color:var(--b2);color:var(--t2)}

/* ── JUMP BAR ── */
.jumpbar{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;padding:4px 0 8px;margin-bottom:6px;scrollbar-width:none;position:sticky;top:calc(env(safe-area-inset-top,0px) + 73px);z-index:150;background:linear-gradient(var(--bg) 80%,transparent)}
.jumpbar::-webkit-scrollbar{display:none}
.tagchip{background:transparent;border:1px solid var(--b1);color:var(--t2);font-family:var(--font);font-size:9px;letter-spacing:1px;padding:4px 10px;border-radius:2px;cursor:pointer;text-transform:uppercase;transition:all .15s;white-space:nowrap;flex:0 0 auto}
.tagchip:hover{border-color:var(--gold);color:var(--g2);background:var(--p2)}

/* ── SECTIONS & SHELVES ── */
.section{margin-bottom:34px;scroll-margin-top:130px}
.sec-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;padding:0 2px}
.sec-plaque{font-family:var(--medieval);font-size:17px;color:#2a1a08;background:linear-gradient(180deg,#dcbc6c,#b8923f 60%,#9a7630);padding:3px 16px;border-radius:3px;border:1px solid #6b4f18;box-shadow:0 2px 4px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.35);letter-spacing:.5px}
.sec-count{font-family:var(--font);font-size:9px;color:var(--t3);letter-spacing:1px;text-transform:uppercase}
.sec-tools{margin-left:auto;display:flex;gap:4px}
.sec-tools button{background:transparent;border:1px solid var(--b1);color:var(--t2);width:26px;height:24px;border-radius:2px;cursor:pointer;font-size:11px;line-height:1}
.sec-tools button:hover:not(:disabled){border-color:var(--gdim);color:var(--gold)}
.sec-tools button.on{border-color:var(--gold);color:var(--g2);background:var(--p2)}
.sec-tools button:disabled{opacity:.25;cursor:default}
.shelf-wrap{position:relative;margin-bottom:14px;background:
  repeating-linear-gradient(90deg,rgba(255,255,255,.012) 0 2px,transparent 2px 7px),
  linear-gradient(180deg,#0f0b06,#1a130a 55%,#23190d);
  border:2px solid #3a2a12;border-bottom:none;border-radius:3px 3px 0 0;
  box-shadow:inset 0 12px 20px rgba(0,0,0,.75),inset 10px 0 16px rgba(0,0,0,.55),inset -10px 0 16px rgba(0,0,0,.55)}
.shelf-wrap::after{content:"";position:absolute;left:-8px;right:-8px;bottom:-14px;height:14px;pointer-events:none;
  background:repeating-linear-gradient(90deg,rgba(0,0,0,.1) 0 3px,transparent 3px 11px),linear-gradient(180deg,#8a6230,#6a4720 45%,#3d2810);
  border-radius:0 0 3px 3px;border-top:1px solid #a47a3c;box-shadow:0 7px 12px rgba(0,0,0,.65)}
.shelf-row{display:flex;align-items:flex-end;gap:2px;overflow-x:auto;overflow-y:hidden;padding:28px 46px 0;min-height:236px;scrollbar-width:thin;scrollbar-color:var(--b2) transparent}

/* a book: 3D box — spine faces you; on hover it turns to show the cover */
.bk{--d:116px;position:relative;width:var(--w);height:var(--h);flex:0 0 auto;perspective:900px;cursor:pointer;margin-right:1px;outline:none;-webkit-tap-highlight-color:transparent}
.bk3{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.22,.9,.28,1)}
.bk:focus-visible .bk3{outline:1px solid var(--gold)}
@media (hover:hover){
  .bk:hover{z-index:30}
  .bk:hover .bk3{transform:translateZ(80px) translateY(-6px) rotateY(-90deg)}
}
.bk.pulled{z-index:30}
.bk.pulled .bk3{transform:translateZ(80px) translateY(-6px) rotateY(-90deg)}
.face{position:absolute;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.f-spine{inset:0;transform:translateZ(calc(var(--d) / 2));border-radius:2px 1px 1px 2px;
  background:linear-gradient(90deg,rgba(0,0,0,.5),rgba(255,255,255,.1) 22%,rgba(0,0,0,.12) 60%,rgba(0,0,0,.55)),var(--c);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.45);display:flex;flex-direction:column;align-items:center;padding:20px 0 18px}
.f-spine::before,.f-spine::after{content:"";position:absolute;left:0;right:0;height:4px;background:linear-gradient(180deg,#e8c878,#9a7630);opacity:.85}
.f-spine::before{top:7px}.f-spine::after{bottom:7px}
.sp-icon{font-size:15px;line-height:1;margin-bottom:8px}
.sp-title{writing-mode:vertical-rl;font-family:var(--font);font-size:11px;letter-spacing:1px;color:#f0dca0;text-shadow:0 1px 2px rgba(0,0,0,.85);flex:1;min-height:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.f-cover{top:0;height:100%;width:var(--d);left:calc((var(--w) - var(--d)) / 2);transform:rotateY(90deg) translateZ(calc(var(--w) / 2));border-radius:1px 4px 4px 1px;padding:8px;display:flex;
  background:linear-gradient(135deg,rgba(255,255,255,.12),transparent 40%,rgba(0,0,0,.4)),var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.5)}
.cv-in{flex:1;min-width:0;border:1px solid rgba(232,200,120,.7);outline:1px solid rgba(232,200,120,.25);outline-offset:-5px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px 8px;gap:7px}
.cv-icon{font-size:30px;line-height:1}
.cv-title{font-family:var(--medieval);font-size:14px;line-height:1.25;color:#f4e2ae;text-shadow:0 1px 3px rgba(0,0,0,.85);word-break:normal;overflow-wrap:normal;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.cv-meta{font-family:var(--font);font-size:8px;letter-spacing:1px;color:rgba(244,226,174,.75);text-transform:uppercase}
.bk-new{flex:0 0 auto;align-self:flex-end;width:44px;height:150px;margin-left:12px;border:2px dashed var(--b2);border-radius:3px;display:flex;align-items:center;justify-content:center;color:var(--t2);font-size:24px;cursor:pointer;transition:all .2s}
.bk-new:hover{border-color:var(--gold);color:var(--g2);background:rgba(200,160,80,.06)}
.empty-s{color:var(--t3);font-size:13px;text-align:center;padding:20px;font-style:italic}

.archive{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:26px}

/* ── BOOK VIEWER ── */
.book-overlay{display:none;position:fixed;inset:0;background:radial-gradient(ellipse at center,#1b150d 0%,#050403 100%);z-index:500;overflow:hidden}
.book-overlay.show{display:block}
.book-container{max-width:1260px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column}
.book-toolbar{display:flex;align-items:center;gap:10px;padding:10px 20px;padding-top:calc(10px + env(safe-area-inset-top,0px));background:rgba(14,12,9,.95);border-bottom:1px solid var(--b2);flex-wrap:wrap;flex-shrink:0}
.book-toolbar-title{font-family:var(--font);font-size:14px;color:var(--gold);flex:1;letter-spacing:1px;min-width:80px}
.book-stage{flex:1;min-height:0;padding:12px 14px 4px}
.turn-bar{display:flex;align-items:center;justify-content:center;gap:18px;padding:8px 14px calc(8px + env(safe-area-inset-bottom,0px));flex-shrink:0}
.turn-btn{background:var(--p2);color:var(--gold);border:1px solid var(--gdim);border-radius:2px;padding:6px 16px;font-family:var(--font);font-size:10px;letter-spacing:1px;cursor:pointer;text-transform:uppercase;transition:all .2s}
.turn-btn:hover:not(:disabled){background:var(--p3);border-color:var(--gold);color:var(--g2)}
.turn-btn:disabled{opacity:.3;cursor:not-allowed}
.page-num{font-family:var(--font);font-size:10px;color:var(--t2);letter-spacing:1.5px;min-width:130px;text-align:center}

/* the open book */
.spread{--pad:46px;--gap:96px;position:relative;width:100%;height:100%;border-radius:4px;background:var(--parch);perspective:4200px;box-shadow:0 12px 44px rgba(0,0,0,.75),0 0 0 1px #3d2a10}
.spread-bg{position:absolute;inset:0;border-radius:4px;pointer-events:none;z-index:0;
  background:
    linear-gradient(90deg,rgba(60,36,10,0) calc(50% - 48px),rgba(60,36,10,.16) calc(50% - 8px),rgba(60,36,10,.42) 50%,rgba(60,36,10,.16) calc(50% + 8px),rgba(60,36,10,0) calc(50% + 48px)),
    linear-gradient(90deg,var(--parch2),var(--parch) 10%,var(--parch) 90%,var(--parch2))}
.spread.single .spread-bg{background:linear-gradient(90deg,var(--parch2),var(--parch) 5%,var(--parch) 95%,var(--parch2))}
.sp-content{position:absolute;top:0;bottom:0;left:0;right:0;padding:34px var(--pad) 26px;z-index:2}
.sp-content.stage{z-index:5}

/* reading: CSS columns = real pages */
.rd-view{position:relative;width:100%;height:100%;overflow:hidden}
.rd-flow{width:100%;height:100%;column-count:2;column-gap:var(--gap);column-fill:auto;font-family:var(--book-body);font-size:16.5px;line-height:1.68;color:var(--ink);overflow-wrap:break-word;will-change:transform}
.rd-flow>:first-child{margin-top:0}
.rd-title{font-family:var(--medieval);font-weight:400;font-size:26px;line-height:1.25;text-align:center;margin:0 0 4px;color:var(--ink);break-after:avoid}
.rd-sub{font-family:var(--font);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;text-align:center;color:var(--ink2);margin-bottom:18px;break-after:avoid}
.rd-flow p{margin:0 0 .65em;orphans:2;widows:2}
.rd-flow h2,.rd-flow h3,.rd-flow h4{font-family:var(--medieval);font-weight:400;color:var(--ink);break-after:avoid;margin:.9em 0 .35em;line-height:1.3}
.rd-flow h2{font-size:21px}.rd-flow h3{font-size:18px}.rd-flow h4{font-size:16px}
.rd-flow ul,.rd-flow ol{margin:0 0 .65em 1.35em}
.rd-flow li{margin:.1em 0;break-inside:avoid}
.rd-flow blockquote{border-left:3px solid var(--ink2);padding-left:12px;margin:0 0 .65em;font-style:italic;color:var(--ink2);break-inside:avoid}
.rd-flow hr{border:none;border-top:1px solid var(--ink2);opacity:.45;margin:1em auto;width:55%}
.rd-flow a{color:#7a3a10}
.rd-flow del{opacity:.7}
.rd-sec{font-family:var(--font);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink2);margin:1.1em 0 .3em;padding-bottom:3px;border-bottom:1px solid var(--parch3);break-after:avoid}

/* page-turn leaf */
.leaf{position:absolute;top:0;bottom:0;width:50%;z-index:6;transform-style:preserve-3d;transition:transform .72s cubic-bezier(.45,.05,.25,1);pointer-events:none}
.leaf.dir-f{left:50%;transform-origin:left center}
.leaf.dir-b{left:0;transform-origin:right center}
.leaf.dir-f.go{transform:rotateY(-180deg)}
.leaf.dir-b.go{transform:rotateY(180deg)}
.leaf-face{position:absolute;inset:0;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.fc-back{transform:rotateY(180deg)}
.dir-f .fc-front,.dir-b .fc-back{background:linear-gradient(90deg,rgba(60,36,10,.34),rgba(60,36,10,0) 9%),var(--parch)}

/* contents (two pages) */
.toc-grid{display:grid;grid-template-columns:1fr 1fr;column-gap:var(--gap);height:100%}

.page-heading{font-family:var(--medieval);font-size:22px;color:var(--ink);margin-bottom:16px;text-align:center}
.chapter-item{padding:10px 0;border-bottom:1px solid var(--parch3);cursor:pointer;transition:color .15s}
.chapter-item:hover{color:var(--ink)}
.chapter-item:hover .chapter-title{text-decoration:underline}
.chapter-item:last-child{border-bottom:none}
.chapter-num{font-family:var(--font);font-size:9px;color:var(--ink2);letter-spacing:1px;margin-bottom:2px}

.chapter-preview{font-size:12px;color:var(--ink2);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.diary-year-group{margin-bottom:20px}
.diary-year-title{font-family:var(--medieval);font-size:26px;color:var(--ink);margin-bottom:4px}
.diary-month-group{margin-bottom:14px;margin-left:12px}
.diary-month-title{font-family:var(--font);font-size:11px;color:var(--ink2);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid var(--parch3)}
.diary-entry-item{padding:6px 0;cursor:pointer;border-bottom:1px solid var(--parch3)}
.diary-entry-item:hover .diary-entry-title{text-decoration:underline}
.diary-entry-date{font-family:var(--font);font-size:9px;color:var(--ink2);letter-spacing:1px}
.diary-entry-title{font-family:var(--medieval);font-size:14px;color:var(--ink)}
.diary-entry-preview{font-size:12px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* writing */
.ed-wrap{display:flex;flex-direction:column;height:100%;gap:8px;max-width:780px;margin:0 auto}

.ed-title{flex:1;min-width:160px;background:transparent;border:none;border-bottom:1px solid var(--parch3);font-family:var(--medieval);font-size:22px;color:var(--ink);outline:none;padding:2px 0}
.ed-title::placeholder,.ed-text::placeholder{color:rgba(74,48,24,.45)}

figure.pola{margin:0 0 1em;padding:8px 8px 10px;background:#fbf6ea;border:1px solid #d8c9a4;box-shadow:0 2px 6px rgba(60,36,10,.3);break-inside:avoid;transform:rotate(-1deg)}

/* ── reorder books ── */

/* ── MODALS ── */
.modal-back{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);align-items:center;justify-content:center;z-index:600;padding:20px}

.modal-box{background:var(--p1);border:1px solid var(--b2);border-radius:var(--r);padding:24px 20px;max-width:320px;width:100%;text-align:center;position:relative}

.modal-btns{display:flex;gap:8px;justify-content:center}

/* ── TOAST ── */
.toast{position:fixed;bottom:12px;left:50%;transform:translateX(-50%) translateY(8px);min-width:160px;max-width:300px;background:var(--p2);color:var(--gold);border:1px solid var(--gdim);border-radius:var(--r);padding:7px 13px;font-family:var(--font);font-size:10px;letter-spacing:.5px;z-index:9999;opacity:0;transition:all .25s;pointer-events:none;text-align:center}

}
</style>

<script>
// ═══════════════════════════════════════════
//  CONFIG — Supabase
// ═══════════════════════════════════════════
const SB_URL  = "https://cfdzwduajsatbydphrtq.supabase.co";
const SB_KEY  = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNmZHp3ZHVhanNhdGJ5ZHBocnRxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc4MzQ2MDIsImV4cCI6MjA5MzQxMDYwMn0.zUB9rASXCXxKVJFfvXrfcMCivQ3fPV4AE0Jvo4hCamQ";
const TABLE   = "biblioteca_livros_store";   // dedicated table — does not touch other apps
const LS_CACHE   = "dragonborn_library_cache_v1";
const LS_PENDING = "dragonborn_library_pending_v1";
const LS_META    = "dragonborn_library_meta_v1";

// ═══════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════
const SPINES=["#8B2020","#204080","#205020","#805010","#602060","#106060","#302010"];
let books=[];
let meta={sections:[]};   // shelf sections order (stored in row id "_meta")
let bookState={bookId:null,view:"toc",chapterId:null,entryId:null,editMode:false,page:0};
let tagFilter="";
const dirty=new Set();      // book ids waiting to be pushed
const removed=new Set();    // book ids waiting to be deleted remotely
let flushTimer=null, textTimer=null, flushing=false;

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let tt;function toast(msg){const el=document.getElementById("toast");el.textContent=msg;el.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>el.classList.remove("show"),2400);}
function badge(txt,cls){const el=document.getElementById("sync-badge");el.textContent=txt;el.className=cls||"";}

// ═══════════════════════════════════════════
//  SUPABASE (REST, no library needed)
// ═══════════════════════════════════════════
async function sb(path,opts={}){
  const res=await fetch(SB_URL+"/rest/v1/"+path,{
    ...opts,
    headers:{apikey:SB_KEY,Authorization:"Bearer "+SB_KEY,"Content-Type":"application/json",...(opts.headers||{})}
  });
  if(!res.ok){const t=await res.text().catch(()=>"");throw new Error(res.status+" "+t.slice(0,200));}
  const txt=await res.text();
  return txt?JSON.parse(txt):null;
}

function cacheLocal(){
  try{
    localStorage.setItem(LS_CACHE,JSON.stringify(books));
    localStorage.setItem(LS_PENDING,JSON.stringify({dirty:[...dirty],removed:[...removed]}));
    localStorage.setItem(LS_META,JSON.stringify(meta));
  }catch(e){}
}
function loadLocal(){
  try{
    const b=JSON.parse(localStorage.getItem(LS_CACHE)||"null");if(Array.isArray(b))books=b;
    const m=JSON.parse(localStorage.getItem(LS_META)||"null");if(m&&Array.isArray(m.sections))meta=m;
    const p=JSON.parse(localStorage.getItem(LS_PENDING)||"null");
    if(p){(p.dirty||[]).forEach(i=>dirty.add(i));(p.removed||[]).forEach(i=>removed.add(i));}
  }catch(e){}
}

async function loadRemote(){
  badge("☁ syncing…","busy");
  try{
    const rows=await sb(TABLE+"?select=id,position,data&order=position.asc");
    const metaRow=rows.find(r=>r.id==="_meta");
    if(metaRow&&!dirty.has("_meta"))meta={sections:[],...metaRow.data};
    const remote=rows.filter(r=>r.id!=="_meta").map(r=>({...r.data,id:r.id}));
    // keep local versions of anything not pushed yet
    const localDirty=new Map(books.filter(b=>dirty.has(b.id)).map(b=>[b.id,b]));
    const merged=remote.filter(b=>!removed.has(b.id)).map(b=>localDirty.get(b.id)||b);
    for(const [id,b] of localDirty) if(!merged.find(x=>x.id===id)) merged.push(b);
    books=merged;
    cacheLocal();
    badge("☁ synced","ok");
    if(dirty.size||removed.size)scheduleFlush(300);
    renderShelf();
    if(bookState.bookId&&document.getElementById("book-overlay").classList.contains("show")&&!bookState.editMode){
      if(!books.find(b=>b.id===bookState.bookId))closeBook();else renderBookView();
    }
  }catch(e){
    console.error(e);
    badge("☁ offline","err");
    if(/relation|does not exist|42P01|PGRST205/.test(e.message))toast("Table not found — run the SQL setup first.");
  }
}

function markDirty(id){dirty.add(id);cacheLocal();scheduleFlush(700);badge("☁ …","busy");}
function scheduleFlush(ms){clearTimeout(flushTimer);flushTimer=setTimeout(flush,ms);}
async function flush(){
  if(flushing)return;
  if(!dirty.size&&!removed.size)return;
  flushing=true;
  const ids=[...dirty],gone=[...removed];
  try{
    if(ids.length){
      const rows=ids.map(id=>{
        if(id==="_meta")return {id,position:-1,data:meta,updated_at:new Date().toISOString()};
        const i=books.findIndex(b=>b.id===id);
        if(i<0)return null;
        return {id,position:i,data:books[i],updated_at:new Date().toISOString()};
      }).filter(Boolean);
      if(rows.length)await sb(TABLE+"?on_conflict=id",{method:"POST",headers:{Prefer:"resolution=merge-duplicates,return=minimal"},body:JSON.stringify(rows)});
    }
    for(const id of gone)await sb(TABLE+"?id=eq."+encodeURIComponent(id),{method:"DELETE",headers:{Prefer:"return=minimal"}});
    ids.forEach(i=>dirty.delete(i));gone.forEach(i=>removed.delete(i));
    cacheLocal();
    badge("☁ synced","ok");
  }catch(e){
    console.error(e);
    badge("☁ retrying…","err");
    scheduleFlush(10000);
  }
  flushing=false;
  if((dirty.size||removed.size)&&!flushTimer)scheduleFlush(1500);
}
function manualSync(){flush().then(loadRemote);}

function counts(b){const T=typeOf(b),n=(b[T.store]||[]).length;return n+" "+(n===1?T.unit:T.units);}
const hashStr=s=>{s=String(s);let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h);};
function spineDims(b){
  const h=hashStr(b.id);
  const size=b.type==="diary"?(b.entries||[]).length:(b.chapters||[]).length;
  return {w:34+Math.min(6,size)*3+(h%3)*3, h:156+(Math.floor(h/7)%5)*9};   // thicker book = more content
}
function getSections(){
  const out=[];
  for(const s of (meta.sections||[]))if(s&&!out.includes(s))out.push(s);
  for(const b of books)if(b.tag&&!out.includes(b.tag))out.push(b.tag);
  return out;
}
let curBlocks=[];
let reorderName=null;
function bookHtml(b,ro){
  const {w,h}=spineDims(b);const id=esc(b.id);
  const arrows=ro?`<div class="rord"><button ${ro.first?"disabled":""} title="Move left" onclick="event.stopPropagation();moveBook('${id}',-1)">‹</button><button ${ro.last?"disabled":""} title="Move right" onclick="event.stopPropagation();moveBook('${id}',1)">›</button></div>`:"";
  return `<div class="bk" style="--w:${w}px;--h:${h}px;--c:${esc(b.color||"#5a4010")}" title="${esc(b.title)}" tabindex="0" role="button" onclick="bookClick(event,'${id}')" onkeydown="if(event.key==='Enter')openBook('${id}')">${arrows}
    <div class="bk3">
      <div class="face f-spine"><span class="sp-icon">${esc(b.icon||"📖")}</span><span class="sp-title">${esc(b.title)}</span></div>
      <div class="face f-cover"><div class="cv-in"><div class="cv-icon">${esc(b.icon||"📖")}</div><div class="cv-title">${esc(b.title)}</div><div class="cv-meta">${esc(typeOf(b).label)} · ${counts(b)}</div></div></div>
    </div></div>`;
}
// shrink titles until they fit: cover = longest word on one line, spine = whole title on its height
function fitTitles(){
  document.querySelectorAll(".cv-title").forEach(el=>{
    let fs=14;el.style.fontSize=fs+"px";el.style.overflowWrap="normal";
    while(fs>9&&el.scrollWidth>el.clientWidth+1){fs-=0.5;el.style.fontSize=fs+"px";}
    if(el.scrollWidth>el.clientWidth+1)el.style.overflowWrap="anywhere";   // last resort
  });
  document.querySelectorAll(".sp-title").forEach(el=>{
    let fs=11;el.style.fontSize=fs+"px";
    while(fs>8&&el.scrollHeight>el.clientHeight+1){fs-=0.5;el.style.fontSize=fs+"px";}
  });
}
function renderShelf(){
  const root=document.getElementById("books-shelf");
  const secs=getSections();
  curBlocks=secs.map(s=>({name:s,list:books.filter(b=>b.tag===s),real:true}));
  const loose=books.filter(b=>!b.tag);
  if(loose.length||!curBlocks.length)curBlocks.push({name:"Unsorted",list:loose,real:false});
  if(reorderName&&!curBlocks.some(b=>b.name===reorderName&&b.list.length>1))reorderName=null;
  document.getElementById("jumpbar").innerHTML=curBlocks.length>1?curBlocks.map((s,i)=>`<button class="tagchip" onclick="jumpTo(${i})">${esc(s.name)}</button>`).join(""):"";
  root.innerHTML=curBlocks.map((s,i)=>{
    const n=s.list.length,on=reorderName===s.name;
    const rbtn=n>1?`<button title="Reorder books" class="${on?"on":""}" onclick="toggleReorder(${i})">⇅</button>`:"";
    const tools=s.real?`<div class="sec-tools">${rbtn}
      <button title="Move up" onclick="secMove(${i},-1)" ${i===0?"disabled":""}>▲</button>
      <button title="Move down" onclick="secMove(${i},1)" ${i===secs.length-1?"disabled":""}>▼</button>
      <button title="Rename" onclick="openSecModal('rename',${i})">✎</button>
      <button title="Delete section" onclick="secDelete(${i})">✕</button></div>`:(rbtn?`<div class="sec-tools">${rbtn}</div>`:"");
    return `<section class="section" id="sec-${i}">
      <div class="sec-head"><span class="sec-plaque">${esc(s.name)}</span><span class="sec-count">${n} ${n===1?"tome":"tomes"}</span>${tools}</div>
      <div class="shelf-wrap${on?" reordering":""}"><div class="shelf-row">${s.list.map((b,k)=>bookHtml(b,on?{first:k===0,last:k===n-1}:null)).join("")}<div class="bk-new" title="New book here" onclick="openBookModal(${i})">+</div></div></div>
    </section>`;
  }).join("");
  fitTitles();
}
function toggleReorder(i){const s=curBlocks[i];if(!s)return;reorderName=reorderName===s.name?null:s.name;renderShelf();}
// swap a book with its neighbour in the same section; every row gets its position rewritten
function moveBook(id,dir){
  const i=books.findIndex(b=>b.id===id);if(i<0)return;
  const tag=books[i].tag||"";
  let j=i+dir;
  while(j>=0&&j<books.length&&(books[j].tag||"")!==tag)j+=dir;
  if(j<0||j>=books.length)return;
  [books[i],books[j]]=[books[j],books[i]];
  books.forEach(b=>markDirty(b.id));
  renderShelf();
}
function jumpTo(i){const el=document.getElementById("sec-"+i);if(el)el.scrollIntoView({behavior:"smooth",block:"start"});}

// touch devices have no hover: 1st tap pulls the book out, 2nd tap opens it
function bookClick(ev,id){
  if(reorderName)return;
  const el=ev.currentTarget;
  if(window.matchMedia("(hover:none)").matches&&!el.classList.contains("pulled")){
    document.querySelectorAll(".bk.pulled").forEach(x=>x.classList.remove("pulled"));
    el.classList.add("pulled");return;
  }
  openBook(id);
}

let secModalMode="create",secModalIdx=null;
function openSecModal(mode,idx){
  secModalMode=mode;secModalIdx=idx;
  document.getElementById("sec-modal-title").textContent=mode==="rename"?"Rename Section":"New Section";
  document.getElementById("sm-name").value=mode==="rename"?curBlocks[idx].name:"";
  document.getElementById("sec-modal").classList.add("show");
  setTimeout(()=>document.getElementById("sm-name").focus(),80);
}
function closeSecModal(){document.getElementById("sec-modal").classList.remove("show");}
function saveSection(){
  const name=document.getElementById("sm-name").value.trim();
  if(!name){toast("Enter a name.");return;}
  const all=getSections();
  if(secModalMode==="rename"){
    const old=curBlocks[secModalIdx].name;
    if(name!==old&&(all.includes(name)||name.toLowerCase()==="unsorted")){toast("That section already exists.");return;}
    if(name!==old){
      books.forEach(b=>{if(b.tag===old){b.tag=name;markDirty(b.id);}});
      meta.sections=all.map(s=>s===old?name:s);markDirty("_meta");
    }
    toast("Section renamed.");
  }else{
    if(all.includes(name)||name.toLowerCase()==="unsorted"){toast("That section already exists.");return;}
    meta.sections=[...all,name];markDirty("_meta");
    toast("Section created!");
  }
  closeSecModal();renderShelf();
  if(secModalMode==="create")setTimeout(()=>jumpTo(curBlocks.findIndex(b=>b.name===name)),50);
}
function secMove(i,dir){
  const all=getSections(),j=i+dir;
  if(j<0||j>=all.length)return;
  [all[i],all[j]]=[all[j],all[i]];
  meta.sections=all;markDirty("_meta");renderShelf();
}
function secDelete(i){
  const s=curBlocks[i];if(!s||!s.real)return;
  const n=s.list.length;
  if(!confirm(n?`Delete section "${s.name}"? Its ${n} book(s) move to Unsorted (nothing is deleted).`:`Delete section "${s.name}"?`))return;
  books.forEach(b=>{if(b.tag===s.name){delete b.tag;markDirty(b.id);}});
  meta.sections=getSections().filter(x=>x!==s.name);markDirty("_meta");
  renderShelf();toast("Section removed.");
}

    else if(f.kind==="date")t=esc(fmtDate(v,"med"));
    else if(f.kind==="emoji"){const o=f.options.find(x=>x[0]===v);t=esc(v)+(link&&o?" "+esc(o[1]):"");}
    else{t=esc(v);if(link&&f.link&&/^https?:\/\//.test(String(v).trim()))t=`<a href="${esc(String(v).trim())}" target="_blank" rel="noopener">${t}</a>`;}
    if(f.pre&&f.kind!=="rating"&&f.kind!=="emoji")t=esc(f.pre)+t;
    out.push(t);
  }
  return out;
}
function searchText(T,it){return [it.title,it.content,...T.fields.map(f=>{const v=it[f.key];return Array.isArray(v)?v.join(" "):v;})].filter(Boolean).join(" ").toLowerCase();}
function isEmptyItem(T,it){
  if((it.title||"").trim()||(it.content||"").trim())return false;
  return T.fields.every(f=>{const v=it[f.key];if(v===undefined||v===null||v===""||v===0)return true;if(Array.isArray(v))return !v.length;return f.default!==undefined&&v===f.default;});
}
function dropIfEmpty(){
  const b=curBook(),it=curItem();if(!b||!it||!it._new)return;
  if(isEmptyItem(typeOf(b),it)){b[typeOf(b).store]=itemsOf(b).filter(x=>x!==it);markDirty(b.id);bookState.itemId=null;}
  else delete it._new;
}

// ── light markdown: **bold** _italic_ ~~strike~~ # headings, - lists, - [ ] tasks, 1. lists, > quote, --- rule, links ──
function inl(s){
  return s
    .replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>')
    .replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>")
    .replace(/~~(.+?)~~/g,"<del>$1</del>")
    .replace(/(^|[\s(>])_([^_\n]+?)_(?=$|[\s.,;:!?)<])/g,"$1<em>$2</em>")
    .replace(/(^|[\s(>])\*([^*\s][^*\n]*?)\*(?=$|[\s.,;:!?)<])/g,"$1<em>$2</em>");
}
function mdToHtml(src,tk){
  const lines=String(src||"").replace(/\r/g,"").split("\n");
  let out="",list=null,tn=0;const para=[];
  const flushP=()=>{if(para.length){out+="<p>"+para.map(inl).join("<br>")+"</p>";para.length=0;}};
  const flushL=()=>{
    if(!list)return;
    out+=`<${list.t}${list.t==="ol"&&list.start!==1?` start="${list.start}"`:""}>`+list.items.map(it=>{
      if(it.task)return `<li class="task${it.task.done?" done":""}"><label><input type="checkbox" class="task" ${tk?`data-k="${tk}" data-n="${it.task.n}" onchange="toggleTask('${tk}',${it.task.n},this.checked)"`:"disabled"} ${it.task.done?"checked":""}> <span>${inl(it.html)}</span></label></li>`;
      return "<li>"+inl(it.html)+"</li>";
    }).join("")+`</${list.t}>`;
    list=null;
  };
  for(const line of lines){
    let m;
    if(!line.trim()){flushP();flushL();continue;}
    if((m=line.match(/^(#{1,3})\s+(.*)$/))){flushP();flushL();const n=m[1].length+1;out+=`<h${n}>${inl(esc(m[2]))}</h${n}>`;continue;}
    if(/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)){flushP();flushL();out+="<hr>";continue;}
    if((m=line.match(/^>\s?(.*)$/))){flushP();flushL();out+="<blockquote>"+inl(esc(m[1]))+"</blockquote>";continue;}
    if((m=line.match(/^\s*[-*•]\s+(.*)$/))){
      flushP();if(!list||list.t!=="ul"){flushL();list={t:"ul",items:[],start:1};}
      const tm=m[1].match(/^\[([ xX])\]\s+(.*)$/);
      if(tm)list.items.push({html:esc(tm[2]),task:{n:tn++,done:tm[1]!==" "}});else list.items.push({html:esc(m[1])});
      continue;
    }
    if((m=line.match(/^\s*(\d+)[.)]\s+(.*)$/))){flushP();if(!list||list.t!=="ol"){flushL();list={t:"ol",items:[],start:+m[1]};}list.items.push({html:esc(m[2])});continue;}
    flushL();para.push(esc(line));
  }
  flushP();flushL();return out;
}
function toggleTask(key,n,checked){
  const book=curBook(),it=curItem();if(!book||!it)return;
  const src=String(it[key]||"").split("\n");let c=0;
  for(let i=0;i<src.length;i++){
    const m=src[i].match(/^(\s*[-*•]\s+)\[([ xX])\](\s+.*)$/);
    if(m){if(c===n){src[i]=m[1]+"["+(checked?"x":" ")+"]"+m[3];break;}c++;}
  }
  it[key]=src.join("\n");markDirty(book.id);
  const cb=document.querySelector(`#rd-flow input.task[data-k="${key}"][data-n="${n}"]`);
  if(cb)cb.closest("li").classList.toggle("done",checked);
  const el=$("rd-prog");if(el&&key==="content"){const st=taskStats(it.content);el.textContent=`${st.done}/${st.total} done`;}
}

// ── open / close ──
function openBook(bookId){
  const book=books.find(b=>b.id===bookId);if(!book)return;
  bookState={bookId,view:"toc",itemId:null,editMode:false,page:0,q:""};
  $("book-overlay").classList.add("show");
  document.body.style.overflow="hidden";
  renderBookView();
}
function closeBook(){
  if(bookState.editMode){saveCurrentText(true);dropIfEmpty();}
  clearStage();
  $("book-overlay").classList.remove("show");
  document.body.style.overflow="";
  bookState.bookId=null;bookState.editMode=false;
  renderShelf();
}
function goToc(){
  if(bookState.editMode){saveCurrentText(true);dropIfEmpty();}
  bookState.view="toc";bookState.editMode=false;bookState.page=0;bookState.itemId=null;
  renderBookView();
}
function startEdit(){bookState.editMode=true;renderBookView();}
function finishEdit(){saveCurrentText();dropIfEmpty();bookState.editMode=false;if(!curItem())bookState.view="toc";renderBookView();}
function clearStage(){document.querySelectorAll("#spread .stage,#spread .leaf").forEach(n=>n.remove());animating=false;}
function openItem(id){bookState.view="item";bookState.itemId=id;bookState.editMode=false;bookState.page=0;renderBookView();}
function newItem(){
  const book=curBook();if(!book)return;
  const T=typeOf(book);
  const it={id:(T.store==="chapters"?"c":"e")+Date.now(),title:"",content:"",_new:true};
  if(T.date)it.date=today();
  T.fields.forEach(f=>{if(f.default!==undefined)it[f.key]=f.default;});
  itemsOf(book).push(it);
  bookState.view="item";bookState.itemId=it.id;bookState.editMode=true;bookState.page=0;

function deleteItem(id){
  const book=curBook();if(!book)return;const T=typeOf(book);
  if(!confirm(`Delete this ${T.unit}?`))return;
  clearTimeout(textTimer);
  book[T.store]=itemsOf(book).filter(i=>i.id!==id);markDirty(book.id);
  bookState.view="toc";bookState.itemId=null;bookState.editMode=false;bookState.page=0;renderBookView();toast("Deleted.");

// ── main render ──
function renderBookView(){
  const book=curBook();if(!book)return;
  const T=typeOf(book);
  clearStage();flowInfo=null;
  $("book-toolbar-title").textContent=book.title;
  const act=$("book-toolbar-actions");act.innerHTML="";
  const host=$("sp-content"),bar=$("turn-bar"),sp=$("spread");
  if(bookState.view!=="item"){
    bar.style.visibility="hidden";sp.classList.toggle("single",narrow());
    renderToc(book,T,host,act);updateTurnUi();return;
  }
  const item=curItem();
  if(!item){bookState.view="toc";renderBookView();return;}
  const del=`deleteItem('${esc(item.id)}')`;
  const back=`<button class="btn-forge btn-ghost" onclick="goToc()">← ${T.store==="chapters"?"ToC":"Index"}</button>`;
  if(bookState.editMode){
    bar.style.visibility="hidden";sp.classList.add("single");
    renderEdit(book,T,item,host);
    act.innerHTML=`<button class="btn-forge" onclick="finishEdit()">Save</button><button class="btn-forge btn-danger" onclick="${del}">Delete</button>${back}`;
    updateTurnUi();

}

// ── contents / index ──
const MOOD_COLORS={"🏆":"#b8923f","🛡️":"#4a7a96","⚔️":"#9a3030","🌙":"#5a4a86","🥀":"#7a5a3a"};
const moodMonth=()=>bookState.moodMonth||today().slice(0,7);
function moodDays(book){
  const m=new Map();
  [...itemsOf(book)].filter(i=>i.date).sort((a,b)=>String(a.date).localeCompare(String(b.date))||String(a.id).localeCompare(String(b.id))).forEach(i=>{
    let d=m.get(i.date);if(!d){d={ids:[],mood:""};m.set(i.date,d);}
    d.ids.push(i.id);if(i.mood)d.mood=i.mood;   // the day's mood = last entry of the day that has one
  });
  return m;
}
function moodInner(book){
  const T=typeOf(book),opts=T.fields.find(f=>f.key==="mood").options;
  const days=moodDays(book);
  if(!bookState.moodMonth){   // default: this month, or the latest month that has entries
    const ks=[...days.keys()].map(k=>k.slice(0,7)).sort(),t=today().slice(0,7);
    bookState.moodMonth=(ks.includes(t)||!ks.length)?t:ks[ks.length-1];
  }
  const cur=bookState.moodMonth;
  const set=new Set([...days.keys()].map(k=>k.slice(0,7)));set.add(today().slice(0,7));if(cur!=="all")set.add(cur);
  const months=[...set].sort().reverse();
  const lbl=ym=>{const [y,m]=ym.split("-").map(Number);return new Date(y,m-1,1).toLocaleDateString("en",{month:"long",year:"numeric"});};
  const sel=`<select onchange="moodSet(this.value)"><option value="all" ${cur==="all"?"selected":""}>All time</option>${months.map(ym=>`<option value="${ym}" ${ym===cur?"selected":""}>${lbl(ym)}</option>`).join("")}</select>`;
  const inRange=[...days.entries()].filter(([k])=>cur==="all"||k.startsWith(cur));
  const counts=Object.fromEntries(opts.map(o=>[o[0],0]));let logged=0;
  inRange.forEach(([,d])=>{logged++;if(d.mood&&counts[d.mood]!==undefined)counts[d.mood]++;});
  const withMood=Object.values(counts).reduce((a,b)=>a+b,0);
  let cal="";
  if(cur!=="all"){
    const [Y,M]=cur.split("-").map(Number),dow=new Date(Y,M-1,1).getDay(),dim=new Date(Y,M,0).getDate();
    cal='<div class="mp-cal">'+["S","M","T","W","T","F","S"].map(x=>`<div class="mp-h">${x}</div>`).join("")+'<div></div>'.repeat(dow);
    for(let d=1;d<=dim;d++){
      const key=`${Y}-${String(M).padStart(2,"0")}-${String(d).padStart(2,"0")}`,info=days.get(key);
      cal+=`<div class="mp-d${info?" has":""}${key===today()?" td":""}"${info?` onclick="openItem('${esc(info.ids[0])}')" title="${info.ids.length} ${info.ids.length===1?T.unit:T.units}"`:""}><span class="n">${d}</span>${info?(info.mood||"·"):""}</div>`;
    }
    cal+="</div>";
  }
  const cnt=`<div class="mp-counts">${opts.map(([e,l])=>`<div class="mp-c" title="${esc(l)}"><div class="e">${e}</div><div class="v">${counts[e]}</div><div class="l">${esc(l)}</div></div>`).join("")}</div>`;
  const bar=withMood?`<div class="mp-bar">${opts.filter(o=>counts[o[0]]).map(([e])=>`<i style="flex:${counts[e]};background:${MOOD_COLORS[e]||"#888"}" title="${e} ${counts[e]}"></i>`).join("")}</div>`:"";
  const sum=`<div class="mp-sum">${logged} ${logged===1?"day":"days"} logged${logged&&withMood<logged?` · ${logged-withMood} without mood`:""}</div>`;
  return `<div class="mp-nav"><button onclick="moodNav(-1)" ${cur==="all"?"disabled":""}>◀</button>${sel}<button onclick="moodNav(1)" ${cur==="all"?"disabled":""}>▶</button></div>${cal}${cnt}${bar}${sum}`;
}
function moodRefresh(){const b=curBook();if(!b)return;document.querySelectorAll(".mood-panel").forEach(el=>el.innerHTML=moodInner(b));}
function moodSet(v){bookState.moodMonth=v;moodRefresh();}
function moodNav(dir){
  const cur=moodMonth();if(cur==="all")return;
  const [y,m]=cur.split("-").map(Number),d=new Date(y,m-1+dir,1);
  bookState.moodMonth=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;moodRefresh();
}
function coverHtml(book,T){
  const items=itemsOf(book);let extra="";
  const hasMood=T.fields.some(f=>f.key==="mood");
  if(book.type==="review"){
    const rated=items.filter(i=>i.rating>0),fin=items.filter(i=>i.status==="done").length;
    extra=`<div class="cv-stat">${fin} finished${rated.length?` · ★ ${(rated.reduce((a,i)=>a+i.rating,0)/rated.length).toFixed(1)} avg`:""}</div>`;
  }else if(book.type==="checklist"){
    let d=0,t=0;items.forEach(i=>{const s=taskStats(i.content);d+=s.done;t+=s.total;});
    if(t)extra=`<div class="cv-stat">${d}/${t} tasks done</div>`;
  }else if(book.type==="study"){
    const n=items.filter(i=>i.status==="review").length;
    if(n)extra=`<div class="cv-stat">${n} to review</div>`;
  }
  if(hasMood){
    return `<div class="page-content" style="text-align:center;padding-top:10px">
      <div style="font-size:34px;line-height:1.1;margin-bottom:4px">${esc(book.icon)}</div>
      <div class="page-heading" style="margin-bottom:2px">${esc(book.title)}</div>
      <div style="font-size:12px;color:var(--ink2)">${esc(T.label)} · ${counts(book)}</div>
      <div class="mood-panel">${moodInner(book)}</div></div>`;
  }
  return `<div class="page-content" style="text-align:center;padding-top:40px">
    <div style="font-size:52px;margin-bottom:16px">${esc(book.icon)}</div>
    <div class="page-heading">${esc(book.title)}</div>
    <div style="margin-top:8px;font-size:13px;color:var(--ink2)">${esc(T.label)}</div>
    <div style="margin-top:4px;font-size:11px;color:var(--ink2)">${counts(book)}</div>${extra}
    <div class="cv-blurb">${esc(T.blurb)}</div></div>`;
}
function renderToc(book,T,host,act){
  const items=itemsOf(book);
  const search=items.length>=6?`<input class="idx-q" id="idx-q" placeholder="Search…" value="${esc(bookState.q||"")}" oninput="idxSearch(this.value)">`:"";
  const nar=`<div class="nar-only" style="text-align:center;margin-bottom:10px"><div style="font-size:34px;line-height:1.1">${esc(book.icon)}</div><div class="page-heading" style="font-size:18px;margin:4px 0 2px">${esc(book.title)}</div><div style="font-size:11px;color:var(--ink2)">${esc(T.label)} · ${counts(book)}</div>${T.fields.some(f=>f.key==="mood")?`<div class="mood-panel">${moodInner(book)}</div>`:""}</div>`;
  host.innerHTML=`<div class="toc-grid"><div class="toc-left">${coverHtml(book,T)}</div><div class="toc-right">${nar}<div class="page-content"><div class="page-heading">${esc(T.indexTitle||"Contents")}</div>${search}<div id="idx-list">${indexHtml(book,T)}</div></div></div></div>`;
  act.innerHTML=`<button class="btn-forge" onclick="newItem()">${esc(T.newLabel)}</button><button class="btn-forge btn-ghost" onclick="openEditBook()">✎ Details</button><button class="btn-forge btn-danger" onclick="deleteBook('${esc(book.id)}')">Delete Book</button>`;
}
function idxSearch(v){bookState.q=v;const b=curBook();if(b&&$("idx-list"))$("idx-list").innerHTML=indexHtml(b,typeOf(b));}
function idxLine(book,T,it,num){
  const bits=[];
  if(T.store==="chapters")bits.push("Chapter "+num);
  if(T.date&&it.date)bits.push(esc(fmtDate(it.date,T.index==="date"?undefined:"med")));
  bits.push(...metaParts(T,it,false,T.groupBy));
  let extra="";
  if(book.type==="checklist"){
    const s=taskStats(it.content);
    if(s.total){bits.push(`${s.done}/${s.total}`);extra=`<div class="prog"><i style="width:${Math.round(100*s.done/s.total)}%"></i></div>`;}
  }
  if(book.type==="scrapbook"){const n=imageList(it.images).length;if(n)bits.push(n+(n===1?" photo":" photos"));}
  const prev=esc(plain(String(it.content||"").slice(0,90)).slice(0,60))||"(empty)";
  return `<div class="ix" onclick="openItem('${esc(it.id)}')">${book.type==="scrapbook"?firstThumb(it):""}<div class="chapter-num">${bits.join(" · ")||"&nbsp;"}</div><div class="chapter-title">${esc(itemTitle(T,it))}</div>${extra}<div class="chapter-preview">${prev}</div></div>`;
}
function indexHtml(book,T){
  let items=[...itemsOf(book)];
  const q=(bookState.q||"").trim().toLowerCase();
  if(q)items=items.filter(it=>searchText(T,it).includes(q));
  if(!items.length)return `<div class="idx-empty">${q?"Nothing matches your search.":esc(T.empty||"Nothing here yet.")}</div>`;
  const line=(it,n)=>idxLine(book,T,it,n);
  const byDateDesc=(a,b)=>String(b.date||"").localeCompare(String(a.date||""));
  const byTitle=(a,b)=>itemTitle(T,a).localeCompare(itemTitle(T,b));
  if(T.index==="date"){
    items.sort(byDateDesc);
    const groups={};
    for(const e of items){
      const d=new Date((e.date||today())+"T00:00:00");
      const y=d.getFullYear(),m=d.toLocaleDateString("en",{month:"long"});
      (groups[y]=groups[y]||{});(groups[y][m]=groups[y][m]||[]).push(e);
    }
    let h="";
    for(const y of Object.keys(groups).sort((a,b)=>b-a)){
      h+=`<div class="diary-year-group"><div class="diary-year-title">${y}</div>`;
      for(const m of Object.keys(groups[y]))h+=`<div class="diary-month-group"><div class="diary-month-title">${m}</div>${groups[y][m].map(e=>line(e)).join("")}</div>`;
      h+="</div>";
    }
    return h;
  }
  if(T.index==="group"){
    const gf=T.fields.find(f=>f.key===T.groupBy);
    const label=v=>{
      if(v===undefined||v===null||v==="")return T.groupFallback||"Other";
      if(gf&&gf.kind==="select"){const o=gf.options.find(x=>x[0]===v);return o?o[1]:v;}
      return String(v).trim();
    };
    const groups=new Map();
    for(const it of items){const k=label(it[T.groupBy]);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(it);}
    const keys=[...groups.keys()];
    if(T.groupOrder&&gf){const ord=T.groupOrder.map(label);keys.sort((a,b)=>((ord.indexOf(a)<0?99:ord.indexOf(a))-(ord.indexOf(b)<0?99:ord.indexOf(b)))||a.localeCompare(b));}
    else keys.sort((a,b)=>a.localeCompare(b));
    return keys.map(k=>{
      const arr=groups.get(k);
      arr.sort(book.type==="review"?((a,b)=>String(b.finished||"").localeCompare(String(a.finished||""))||byTitle(a,b)):byTitle);
      return `<div class="diary-month-group" style="margin-left:0"><div class="diary-month-title">${esc(k)} <span style="opacity:.6">· ${arr.length}</span></div>${arr.map(e=>line(e)).join("")}</div>`;
    }).join("");
  }
  if(T.sort==="date")items.sort(byDateDesc);
  return items.map((it,i)=>line(it,i+1)).join("");
}

// ── reading ──
function secHtml(label){return label?`<div class="rd-sec">${esc(label)}</div>`:"";}
function fieldHtml(f,v){
  if(f.kind==="lines"){const a=(Array.isArray(v)?v:String(v||"").split("\n")).map(x=>String(x).trim()).filter(Boolean);return a.length?`<ul>${a.map(x=>"<li>"+inl(esc(x))+"</li>").join("")}</ul>`:"";}
  if(f.kind==="md")return String(v||"").trim()?mdToHtml(v,f.key):"";
  if(f.kind==="images")return imagesHtml(v);
  return "";
}
function renderRead(book,T,item,host){
  const parts=[];
  if(T.store==="chapters")parts.push(`Chapter ${itemsOf(book).indexOf(item)+1} · ${esc(book.title)}`);
  if(T.date&&item.date)parts.push(esc(fmtDate(item.date,T.dateLong?true:"med")));
  parts.push(...metaParts(T,item,true));
  if(T.progress){const st=taskStats(item.content);if(st.total)parts.push(`<span id="rd-prog">${st.done}/${st.total} done</span>`);}
  let body="";
  const order=T.order||["content"];
  for(const key of order){
    if(key==="content"){
      const c=String(item.content||"");
      if(c.trim()){const h=mdToHtml(c,"content");body+=secHtml(order.length>1?T.contentLabel:"")+(T.quote?`<div class="q-big">${h}</div>`:h);}
    }else{
      const f=T.fields.find(x=>x.key===key);if(!f)continue;
      const h=fieldHtml(f,item[key]);
      if(h)body+=(f.kind==="images"?"":secHtml(f.head||f.label))+h;
    }
  }
  if(!body)body=`<p class="rd-empty">Nothing written yet.</p>`;
  const head=T.quote?`<div class="rd-glyph">❝</div>`:`<h1 class="rd-title">${esc(itemTitle(T,item))}</h1><div class="rd-sub">${parts.join(" · ")}</div>`;
  const foot=T.quote?`<div class="q-by">${parts.join(" · ")}</div>`:"";
  host.innerHTML=`<div class="rd-view" id="rd-view"><div class="rd-flow" id="rd-flow">${head}${body}${foot}</div></div>`;
  const rm=()=>{clearTimeout(imgT);imgT=setTimeout(()=>{if(!animating&&$("rd-view"))measure();},80);};
  host.querySelectorAll("img").forEach(i=>{if(!i.complete){i.addEventListener("load",rm);i.addEventListener("error",rm);}});
  requestAnimationFrame(()=>{
    measure();
    if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(!animating&&$("rd-view"))measure();});
  });
}

// ═══════════════════════════════════════════
//  VIEWER — columns = pages, real two-page spreads
// ═══════════════════════════════════════════
function measure(){
  const view=$("rd-view"),flow=$("rd-flow");if(!view||!flow)return;
  flow.style.setProperty("--ph",view.clientHeight+"px");
  const gap=parseFloat(getComputedStyle(flow).columnGap)||0;
  const vw=view.clientWidth,c=cols();
  const colW=(vw-gap*(c-1))/c;
  const total=Math.max(1,Math.round((view.scrollWidth+gap)/(colW+gap)));
  flowInfo={view,flow,gap,vw,colW,c,ph:view.clientHeight,total,spreads:Math.max(1,Math.ceil(total/c)),stride:vw+gap};
  bookState.page=Math.min(Math.max(0,bookState.page||0),flowInfo.spreads-1);
  flow.style.transition="none";
  flow.style.transform=`translateX(${-bookState.page*flowInfo.stride}px)`;
  updateTurnUi();
}
function updateTurnUi(){
  const F=flowInfo,p=$("turn-prev"),n=$("turn-next"),num=$("page-num");
  if(!F){p.disabled=true;n.disabled=true;num.textContent="";return;}
  const s=bookState.page;
  p.disabled=s<=0;n.disabled=s>=F.spreads-1;
  const a=s*F.c+1,b=Math.min(F.total,a+F.c-1);
  num.textContent=F.total===1?"Page 1":(a===b?`Page ${a} of ${F.total}`:`Pages ${a}–${b} of ${F.total}`);
}

function turnPage(dir){
  if(animating||bookState.editMode||!flowInfo)return;
  const from=bookState.page,to=from+dir;
  if(to<0||to>=flowInfo.spreads)return;
  bookState.page=to;
  const reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(flowInfo.c===1||reduce){
    flowInfo.flow.style.transition=reduce?"none":"transform .32s ease";
    flowInfo.flow.style.transform=`translateX(${-to*flowInfo.stride}px)`;
    updateTurnUi();return;
  }
  flipSpread(from,to,dir);
}

// one half of a spread (left or right page) cut out of the flowing text
function buildHalf(spreadIdx,side){
  const F=flowInfo;
  const half=document.createElement("div");
  half.style.cssText=`--ph:${F.ph}px;position:absolute;top:0;height:100%;width:${F.colW}px;left:${side==="L"?0:F.colW+F.gap}px;overflow:hidden`;
  const f=F.flow.cloneNode(true);f.removeAttribute("id");
  f.style.cssText=`position:absolute;top:0;left:${side==="L"?0:-(F.colW+F.gap)}px;width:${F.vw}px;height:100%;transition:none;transform:translateX(${-spreadIdx*F.stride}px)`;
  half.appendChild(f);return half;
}
function frame(offsetX,W,child){
  const d=document.createElement("div");d.className="sp-content";
  d.style.cssText=`left:${offsetX}px;right:auto;width:${W}px;z-index:auto`;
  const v=document.createElement("div");v.className="rd-view";v.appendChild(child);d.appendChild(v);return d;
}
function flipSpread(from,to,dir){
  animating=true;
  const sp=$("spread"),F=flowInfo,W=sp.clientWidth;
  F.view.style.visibility="hidden";
  F.flow.style.transform=`translateX(${-to*F.stride}px)`;
  updateTurnUi();
  // pages that stay put while the leaf turns
  const stage=document.createElement("div");stage.className="sp-content stage";
  const sv=document.createElement("div");sv.className="rd-view";
  sv.append(buildHalf(dir>0?from:to,"L"),buildHalf(dir>0?to:from,"R"));
  stage.appendChild(sv);
  // the turning leaf: front = page being lifted, back = page revealed on the other side
  const leaf=document.createElement("div");leaf.className="leaf "+(dir>0?"dir-f":"dir-b");
  const front=document.createElement("div");front.className="leaf-face fc-front";
  const back=document.createElement("div");back.className="leaf-face fc-back";
  if(dir>0){front.appendChild(frame(-W/2,W,buildHalf(from,"R")));back.appendChild(frame(0,W,buildHalf(to,"L")));}
  else{front.appendChild(frame(0,W,buildHalf(from,"L")));back.appendChild(frame(-W/2,W,buildHalf(to,"R")));}
  leaf.append(front,back);
  sp.append(stage,leaf);
  void leaf.offsetWidth;
  leaf.classList.add("go");
  setTimeout(()=>{stage.remove();leaf.remove();F.view.style.visibility="";animating=false;},760);
}

// ── writing ──
function ctl(f,item){
  const v=item[f.key],id="f-"+f.key;
  switch(f.kind){
    case "select":return `<select id="${id}" onchange="queueTextSave()">${f.options.map(([a,b])=>`<option value="${esc(a)}" ${v===a?"selected":""}>${esc(b)}</option>`).join("")}</select>`;
    case "emoji":{const cur=f.options.find(o=>o[0]===v);return `<div class="emo" id="${id}" data-val="${esc(v||"")}">${f.options.map(([e,l])=>`<button type="button" title="${esc(l)}" class="${v===e?"on":""}" onclick="pickEmoji('${id}',this)">${e}</button>`).join("")}<span class="emo-l">${cur?esc(cur[1]):""}</span></div>`;}
    case "rating":return `<div class="stars" id="${id}" data-val="${+v||0}">${[1,2,3,4,5].map(n=>`<span class="${n<=(+v||0)?"on":""}" onclick="setStar('${id}',${n})">★</span>`).join("")}</div>`;
    case "date":return `<input id="${id}" type="date" value="${esc(v||"")}" onchange="queueTextSave()">`;
    case "lines":case "md":case "images":return `<textarea class="ed-sub" id="${id}" rows="${f.rows||3}" placeholder="${esc(f.ph||"")}" oninput="grow(this,60);queueTextSave()"></textarea>`;
    default:return `<input id="${id}" type="text" value="${esc(v||"")}" placeholder="${esc(f.ph||"")}" oninput="queueTextSave()">`;
  }
}
function pickEmoji(id,btn){
  const w=$(id),was=btn.classList.contains("on");
  w.querySelectorAll("button").forEach(b=>b.classList.remove("on"));
  if(!was){btn.classList.add("on");w.dataset.val=btn.textContent;}else w.dataset.val="";
  const lb=w.querySelector(".emo-l");if(lb)lb.textContent=was?"":btn.title;
  queueTextSave();
}
function setStar(id,n){
  const w=$(id),cur=+w.dataset.val||0,v=cur===n?0:n;
  w.dataset.val=v;w.querySelectorAll("span").forEach((s,i)=>s.classList.toggle("on",i<v));
  queueTextSave();
}
function grow(ta,min){ta.style.height="auto";ta.style.height=Math.max(ta.scrollHeight+2,min||60)+"px";}
function edInput(ta){if(!ta.closest(".ed-wrap.fill"))grow(ta,+ta.dataset.min||260);queueTextSave();edCount();}

function renderEdit(book,T,item,host){
  const fill=!T.fields.length&&!T.contentLabel;
  const shortF=T.fields.filter(f=>["text","select","emoji","rating","date"].includes(f.kind));
  const longF=T.fields.filter(f=>["md","lines","images"].includes(f.kind));
  const bar=[["bold","<b>B</b>","Bold (Ctrl+B)"],["italic","<i>I</i>","Italic (Ctrl+I)"],["strike","<s>S</s>","Strikethrough"],["h2","H","Heading"],["ul","• List","Bulleted list"],["ol","1.","Numbered list"],["task","☑","Checklist item"],["quote","❝","Quote"],["hr","―","Divider"]]
    .map(([k,l,t])=>`<button type="button" title="${t}" onmousedown="event.preventDefault()" onclick="fmt('${k}')">${l}</button>`).join("");
  const field=f=>`<div class="ed-f"><label>${esc(f.label)}</label>${ctl(f,item)}</div>`;
  host.innerHTML=`<div class="ed-wrap ${fill?"fill":""}">
    <div class="ed-top">${T.noTitle?"":`<input class="ed-title" id="ed-title" placeholder="${T.store==="chapters"?"Chapter title":"Title"}" oninput="queueTextSave()">`}${T.date?`<input class="ed-date" id="ed-date" type="date" onchange="queueTextSave()">`:""}</div>
    ${shortF.length?`<div class="ed-fields">${shortF.map(field).join("")}</div>`:""}
    <div class="ed-bar">${bar}</div>
    ${T.contentLabel?`<div class="ed-lbl">${esc(T.contentLabel)}</div>`:""}
    <textarea class="ed-text" id="ed-text" data-min="${T.minH||260}" placeholder="${esc(T.ph||"")}" oninput="edInput(this)" onkeydown="edKey(event)"></textarea>
    ${longF.length?`<div class="ed-more">${longF.map(field).join("")}</div>`:""}
    <div class="ed-foot"><span id="ed-count"></span><span id="ed-status">autosave on</span></div></div>`;
  if($("ed-title"))$("ed-title").value=item.title||"";
  if($("ed-date"))$("ed-date").value=item.date||"";
  for(const f of longF){const v=item[f.key];$("f-"+f.key).value=f.kind==="lines"?(Array.isArray(v)?v.join("\n"):String(v||"")):String(v||"");}
  const ta=$("ed-text");ta.value=item.content||"";edCount();
  requestAnimationFrame(()=>{
    if(!fill){grow(ta,+ta.dataset.min);document.querySelectorAll(".ed-sub").forEach(x=>grow(x,60));}
    const first=(item._new&&$("ed-title"))?$("ed-title"):ta;
    if(!narrow()||item._new){first.focus();if(first===ta)ta.setSelectionRange(ta.value.length,ta.value.length);}
  });
}
function edCount(){
  const ta=$("ed-text"),c=$("ed-count");if(!ta||!c)return;
  c.textContent=(ta.value.trim().match(/\S+/g)||[]).length+" words";
}
function edKey(e){
  if(!(e.ctrlKey||e.metaKey))return;
  const k=e.key.toLowerCase();
  if(k==="b"){e.preventDefault();fmt("bold");}
  else if(k==="i"){e.preventDefault();fmt("italic");}
  else if(k==="s"){e.preventDefault();saveCurrentText();}
}
function fmt(kind){
  const ta=$("ed-text");if(!ta)return;
  const v=ta.value,s=ta.selectionStart,e=ta.selectionEnd;
  const wraps={bold:["**","**"],italic:["_","_"],strike:["~~","~~"]};
  if(wraps[kind]){
    const [l,r]=wraps[kind],sel=v.slice(s,e)||"text";
    ta.value=v.slice(0,s)+l+sel+r+v.slice(e);
    ta.focus();ta.setSelectionRange(s+l.length,s+l.length+sel.length);
  }else if(kind==="hr"){
    ta.value=v.slice(0,s)+"\n\n---\n\n"+v.slice(e);
    ta.focus();ta.setSelectionRange(s+7,s+7);
  }else{
    const prefix={h2:"## ",ul:"- ",ol:"1. ",task:"- [ ] ",quote:"> "}[kind];
    const ls=v.lastIndexOf("\n",s-1)+1;let le=v.indexOf("\n",e);if(le<0)le=v.length;
    const block=v.slice(ls,le).split("\n");
    const all=block.every(l=>l.startsWith(prefix));
    const out=block.map(l=>all?l.slice(prefix.length):prefix+l).join("\n");
    ta.value=v.slice(0,ls)+out+v.slice(le);
    ta.focus();ta.setSelectionRange(ls,ls+out.length);
  }
  edInput(ta);
}

// ── text saving ──
function queueTextSave(){clearTimeout(textTimer);textTimer=setTimeout(()=>saveCurrentText(true),1500);}
function saveCurrentText(silent){
  clearTimeout(textTimer);
  const book=curBook();if(!book||!bookState.editMode)return;
  const item=curItem(),ta=$("ed-text");if(!item||!ta)return;
  const T=typeOf(book);
  item.content=ta.value;
  const t=$("ed-title");
  if(t){const v=t.value.trim();item.title=T.store==="chapters"?(v||item.title||"Untitled"):v;}
  const dt=$("ed-date");if(dt&&dt.value)item.date=dt.value;
  for(const f of T.fields){
    const el=$("f-"+f.key);if(!el)continue;
    let v;
    if(f.kind==="emoji")v=el.dataset.val||"";
    else if(f.kind==="rating")v=+el.dataset.val||0;
    else if(f.kind==="lines")v=el.value.split("\n").map(x=>x.trim()).filter(Boolean);
    else if(f.kind==="md"||f.kind==="images")v=el.value;
    else v=el.value.trim();
    item[f.key]=v;
  }
  if(item._new&&!isEmptyItem(T,item))delete item._new;
  markDirty(book.id);
  const st=$("ed-status");if(st)st.textContent="saved "+new Date().toLocaleTimeString("en",{hour:"2-digit",minute:"2-digit"});
  if(!silent)toast("Saved!");
}

// ── changing a book's type (items are kept) ──
function foldFields(T,it){
  let txt=String(it.content||"");
  for(const f of T.fields){
    const v=it[f.key];
    if(v===undefined||v===null||v===""||v===0||(Array.isArray(v)&&!v.length))continue;
    let val;
    if(Array.isArray(v))val="\n"+v.map(x=>"- "+x).join("\n");
    else if(f.kind==="select"){const o=f.options.find(x=>x[0]===v);val=o?o[1]:v;}
    else val=v;
    txt+=(txt?"\n\n":"")+"**"+f.label.replace(/\s*\(.*\)$/,"")+":** "+val;
  }
  return txt;
}
function convertBook(b,newType){
  const oldT=typeOf(b),newT=TYPES[newType],src=itemsOf(b);
  if(oldT.store!==newT.store){
    const out=src.map(it=>{
      const o={id:it.id,title:it.title||(newT.store==="chapters"?itemTitle(oldT,it):""),content:oldT.store==="chapters"?(it.content||""):foldFields(oldT,it)};
      if(newT.date)o.date=it.date||today();
      return o;
    });
    b[oldT.store]=[];b[newT.store]=out;
  }else if(newT.date){src.forEach(it=>{if(!it.date)it.date=today();});}
  b.type=newType;
}

function deleteBook(bid){
  if(!confirm("Delete this entire book?"))return;
  clearTimeout(textTimer);
  bookState.editMode=false;
  books=books.filter(b=>b.id!==bid);
  dirty.delete(bid);removed.add(bid);cacheLocal();scheduleFlush(300);
  closeBook();toast("Book deleted.");
}

function exportBooks(){
  const blob=new Blob([JSON.stringify({books,sections:getSections(),_exportedAt:Date.now()},null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="dragonborn_library_"+new Date().toISOString().slice(0,10)+".json";
  a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function importBooks(input){
  const f=input.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      const arr=Array.isArray(d)?d:(d.books||[]);
      if(!arr.length){toast("No books found in file.");return;}
      let added=0;
      for(const b of arr){
        if(!b||!b.id||!b.title)continue;
        if(books.find(x=>x.id===b.id))continue;   // never overwrite existing books
        books.push(b);markDirty(b.id);added++;
      }
      renderShelf();
      toast(added?`${added} book(s) imported.`:"Nothing new to import.");
    }catch(e){toast("Invalid JSON file.");}
    input.value="";
  };
  r.readAsText(f);
}

let deferredInstall=null;
const isStandalone=()=>window.matchMedia("(display-mode: standalone)").matches||window.navigator.standalone===true;
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
function setupPWA(){
  const link=rel=>{const l=document.createElement("link");l.rel=rel;document.head.appendChild(l);return l;};
  link("apple-touch-icon").href=ICON_192;                       // iPhone / iPad home-screen icon
  if(!/^https?:$/.test(location.protocol))return;                // install needs https (GitHub Pages) or localhost
  const base=new URL(location.pathname,location.origin).href;
  const manifest={
    id:base,name:"Dragonborn Library",short_name:"Library",
    description:"Tomes & chronicles: diaries, notes, reviews and more.",
    start_url:base,scope:new URL("./",location.href).href,
    display:"standalone",background_color:"#0e0c09",theme_color:"#0e0c09",
    icons:[
      {src:ICON_192,sizes:"192x192",type:"image/png",purpose:"any"},
      {src:ICON_512,sizes:"512x512",type:"image/png",purpose:"any"},
      {src:ICON_192,sizes:"192x192",type:"image/png",purpose:"maskable"},
      {src:ICON_512,sizes:"512x512",type:"image/png",purpose:"maskable"}
    ]
  };
  link("manifest").href=URL.createObjectURL(new Blob([JSON.stringify(manifest)],{type:"application/manifest+json"}));
  // optional: sw.js next to this file = offline cache (the app still works as a plain page without it)
  if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
}
function updateInstallUi(){
  const show=!isStandalone()&&(!!deferredInstall||isIOS());
  document.getElementById("install-btn").style.display=show?"inline-block":"none";
}
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredInstall=e;updateInstallUi();});
window.addEventListener("appinstalled",()=>{deferredInstall=null;updateInstallUi();toast("App installed!");});
async function installApp(){
  if(deferredInstall){
    deferredInstall.prompt();
    try{await deferredInstall.userChoice;}catch(e){}
    deferredInstall=null;updateInstallUi();
  }else if(isIOS()){
    document.getElementById("ios-modal").classList.add("show");
  }
}

// ═══════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════
document.addEventListener("keydown",e=>{
  const open=["book-modal","sec-modal","ios-modal"].map($).find(m=>m.classList.contains("show"));
  if(e.key==="Escape"){
    if(open){open.classList.remove("show");return;}
    if($("book-overlay").classList.contains("show")&&!bookState.editMode){if(bookState.view!=="toc")goToc();else closeBook();}
    return;
  }
  if(open||!isReading())return;
  if(e.target.closest&&e.target.closest("input,textarea,select"))return;
  if(e.key==="ArrowRight"||e.key==="PageDown")turnPage(1);
  else if(e.key==="ArrowLeft"||e.key==="PageUp")turnPage(-1);
});
// swipe to turn (touch)
(()=>{
  let tx=null,ty=0;const sp=$("spread");
  sp.addEventListener("touchstart",e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
  sp.addEventListener("touchend",e=>{
    if(tx==null)return;
    const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;tx=null;
    if(isReading()&&Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5)turnPage(dx<0?1:-1);
  },{passive:true});
})();
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="visible"&&!bookState.editMode&&!dirty.size&&!removed.size)loadRemote();
  if(document.visibilityState==="hidden"){if(bookState.editMode)saveCurrentText(true);flush();}
});
window.addEventListener("beforeunload",()=>{if(bookState.editMode)saveCurrentText(true);});
let roTimer=null;
new ResizeObserver(()=>{
  clearTimeout(roTimer);
  roTimer=setTimeout(()=>{
    if(!$("book-overlay").classList.contains("show")||animating)return;
    $("spread").classList.toggle("single",narrow()||(bookState.view!=="toc"&&bookState.editMode));
    if(isReading())measure();
  },120);
}).observe($("spread"));

setupPWA();
updateInstallUi();
loadLocal();
renderShelf();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitTitles);
loadRemote();
</script>
